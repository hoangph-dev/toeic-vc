 const c=S.cards[id]||(S.cards[id]={iv:0,ease:2.5,due:0,ok:0,w:0,n:0,last:0}),now=Date.now();
 const fresh=!c.n||c.x;c.n++;c.last=now;if(c.x){c.x=0;c.iv=0}
 if(g==='again'){c.w++;c.iv=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+12e4}
 else{c.ok++;c.iv=ivl(c,g);c.ease=g==='hard'?Math.max(1.3,c.ease-.1):g==='easy'?c.ease+.15:c.ease;c.due=now+c.iv*DAY}

 else h+=`<div class="fw" style="font-size:24px">${esc(w.word)}</div><div style="font-size:26px;font-weight:700;color:var(--pr);margin:10px 0">${esc(w.meaning)}</div><div class="mu">(${esc(w.pos)})</div>${w.example?`<p><i>${esc(w.example)}</i><br><span class="mu">${esc(w.translation)}</span></p>`:''}${w.synonyms?`<p class="sm">≈ ${esc(w.synonyms)}</p>`:''}${w.antonyms?`<p class="sm">≠ ${esc(w.antonyms)}</p>`:''}`;

/* ===== QUIZ (4 types, smart selection) ===== */
function pickIds(n,pool){ // weighted sampling: mistakes, overdue, unseen, low ease first
 const now=Date.now();let items=(pool||W.map(w=>w.id)).map(id=>{const c=cd(id);
  let wt=!c?2.5:1+c.w*2+(c.due<now?1.5:0)+(3-Math.min(3,c.ease))+(c.ok>c.w?0:1);return{id,k:Math.random()**(1/wt)}});
 return items.sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.id)}
function mkQ(id,t){const w=W[id];let pool=W.filter(x=>x.meaning!==w.meaning),same=pool.filter(x=>x.pos===w.pos);
 const d=shuf(same.length>15?same:pool).slice(0,3);return{id,t,o:shuf([w,...d]).map(x=>x.id)}}
function startQuiz(ids){ids=ids||pickIds(qn);if(!ids.length)return;
 Q={qs:ids.map((id,i)=>mkQ(id,i%4||(TTS()?0:1))),i:0,ok:0,bad:[],a:null,typed:''};Q.qs=shuf(Q.qs);V='quiz';render()}
function quizView(){
 if(!Q)return `<h1>Quiz</h1><p class="mu">Ưu tiên từ hay sai, lâu chưa ôn và chưa học.</p><div class="cd"><b>Số câu</b><div class="gr">${[10,20].map(n=>`<button class="btn ${qn===n?'':'s'}" style="margin:0" onclick="qn=${n};render()">${n} câu</button>`).join('')}</div><button class="btn" onclick="startQuiz()">🧠 Quick Quiz</button>${cnt(wrongy)?`<button class="btn s" onclick="A.mquiz()">🔥 Quiz từ hay sai (${cnt(wrongy)})</button>`:''}</div>`;
 if(Q.i>=Q.qs.length){const n=Q.qs.length,acc=Math.round(Q.ok/n*100);
  return `<div class="cd" style="text-align:center"><h1>Kết quả</h1><div class="big">${Q.ok}/${n}</div><p class="mu">Accuracy ${acc}% · Đúng ${Q.ok} · Sai ${n-Q.ok}</p></div>
  ${Q.bad.length?`<div class="cd"><b>Từ sai</b>${Q.bad.map(id=>`<div class="wi" role="button" tabindex="0" onclick="A.open(${id})"><b>${esc(W[id].word)}</b><span class="mu">${esc(W[id].meaning)}</span></div>`).join('')}</div><button class="btn" onclick="A.rev()">Review mistakes</button>`:''}
  <button class="btn s" onclick="Q=null;render()">Làm lại</button>`}
 const q=Q.qs[Q.i],w=W[q.id],done=Q.a!==null;let h=`<div class="row sp mu sm"><span>Câu ${Q.i+1}/${Q.qs.length}</span><span>✅ ${Q.ok}</span></div><div class="bar" style="margin:8px 0"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class="cd">`;
 if(q.t===0)h+=`<span class="mu sm">Nghe và chọn từ đúng</span><div style="text-align:center;margin:10px 0"><button class="ic" style="width:84px;height:84px;font-size:38px" aria-label="Nghe lại" onclick="say(W[${w.id}].word)">🔊</button></div>`;
 if(q.t===1)h+=`<span class="mu sm">English → Vietnamese</span><div class="fw">${esc(w.word)}</div><span class="tag">${esc(w.pos)}</span>`;
 if(q.t===2)h+=`<span class="mu sm">Vietnamese → English</span><div class="big" style="font-size:24px">${esc(w.meaning)}</div>`;
 if(q.t===3)h+=`<span class="mu sm">Type the answer</span><div class="big" style="font-size:24px">${esc(w.meaning)}</div><span class="tag">${esc(w.pos)} · ${w.word.length} chữ cái</span>`;
 h+='</div>';
 if(q.t<3)h+=q.o.map((id,k)=>{let c='';if(done){if(id===q.id)c='ok';else if(k===Q.a)c='no'}return `<button class="op ${c}" ${done?'disabled':''} onclick="A.pick(${k})">${esc(q.t===2||q.t===0?W[id].word:W[id].meaning)}</button>`}).join('');
 else h+=`<input id="ty" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ từ tiếng Anh" value="${esc(Q.typed)}" ${done?'disabled':''} onkeydown="if(event.key==='Enter')A.chk()">${done?'':'<button class="btn" onclick="A.chk()">Kiểm tra</button>'}`;
 if(done){const r=Q.right;h+=`<div class="cd" style="margin-top:12px;border-left:5px solid var(--${r?'ok':'er'})"><b>${r?'✅ Chính xác!':'❌ Chưa đúng'}</b><br>Đáp án: <b>${esc(w.word)}</b> (${esc(w.pos)}) — ${esc(w.meaning)}${w.example?`<br><i class="sm">${esc(w.example)}</i>`:''}</div><button class="btn" onclick="A.next()">${Q.i+1>=Q.qs.length?'Xem kết quả':'Next'}</button>`}
 return h}
function answered(right){const q=Q.qs[Q.i];Q.right=right;if(right)Q.ok++;else Q.bad.push(q.id);quizMark(q.id,right);render()}

const sc={new:'var(--mu)',learning:'var(--wa)',due:'var(--er)',mastered:'var(--ok)'};
function listHtml(){let a=W.filter(w=>(!F.t||w.topic===F.t)&&(!F.p||w.pos===F.p)&&(!F.q||w.word.toLowerCase().includes(F.q)||w.meaning.toLowerCase().includes(F.q)));
 if(F.s==='az')a.sort((x,y)=>x.word.localeCompare(y.word));
 if(F.s==='hard')a.sort((x,y)=>(cd(y.id)?cd(y.id).w:0)-(cd(x.id)?cd(x.id).w:0));
 if(F.s==='st')a.sort((x,y)=>['due','learning','new','mastered'].indexOf(status(x.id))-['due','learning','new','mastered'].indexOf(status(y.id)));
 return `<p class="mu sm">${a.length} từ</p>`+a.slice(0,F.lim).map(w=>`<div class="wi" role="button" tabindex="0" onclick="A.open(${w.id})"><div class="row" style="align-items:flex-start"><span class="dot" style="background:${sc[status(w.id)]}"></span><div><b>${esc(w.word)}</b> <span class="mu sm">${esc(w.pos)}</span><div class="mu sm">${esc(w.meaning)}</div></div></div><span class="mu sm">${w.topic.replace('Bài ','B')}</span></div>`).join('')+(a.length>F.lim?`<button class="btn s" onclick="F.lim+=100;A.list()">Hiện thêm</button>`:'')}
function wordsView(){const o=(arr,v,l)=>arr.map(x=>`<option value="${esc(x)}" ${v===x?'selected':''}>${esc(x)}</option>`).join('');

 <select onchange="F.s=this.value;A.list()"><option value="az" ${F.s==='az'?'selected':''}>Sắp xếp: A → Z</option><option value="hard" ${F.s==='hard'?'selected':''}>Sắp xếp: Độ khó (hay sai)</option><option value="st" ${F.s==='st'?'selected':''}>Sắp xếp: Trạng thái học</option></select><div id="lst">${listHtml()}</div>`}

 <span class="tag">${esc(w.pos)}</span><span class="tag">${esc(w.topic)}</span><span class="tag">${status(id)}</span>

 ${c?`<div class="cd sm">Đã ôn ${c.n} lần · đúng ${c.ok} · sai ${c.w}<br>Khoảng cách: ${c.iv.toFixed(1)} ngày · Ôn tiếp: ${new Date(c.due).toLocaleDateString('vi-VN')}</div><button class="btn s" onclick="A.reset(${id})">Reset tiến trình từ này</button>`:'<p class="mu">Chưa học từ này.</p>'}
 <button class="btn" onclick="A.close();startLearn([${id}],'Từ đơn')">Học từ này</button><button class="btn s" onclick="A.close()">Đóng</button></div></div>`}

function statsView(){const acc=S.reviews?accAll():0;
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*DAY);return[['CN','T2','T3','T4','T5','T6','T7'][d.getDay()],S.hist[day(d)]||0]}),mx=Math.max(1,...days.map(d=>d[1]));
 const t=(n,l)=>`<div class="cd"><div class="big">${n}</div><span class="mu sm">${l}</span></div>`,qa=S.qz.q?Math.round(S.qz.ok/S.qz.q*100):0;

 <h2>7 ngày gần đây</h2><div class="cd bars">${days.map(d=>`<div><i style="height:${d[1]/mx*80}px"></i>${d[1]}<br>${d[0]}</div>`).join('')}</div>

function homeView(){const h=new Date().getHours(),n=S.today.d===day()?S.today.n:0,p=Math.min(100,n/S.goal*100),st=curStreak();
 const t=(e,n,l)=>`<div class="cd"><div class="big">${e} ${n}</div><span class="mu sm">${l}</span></div>`;
 return `<div class="row sp"><div><h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'} 👋</h1><span class="mu">${W.length} từ · ${TOPICS.length} bài</span></div><button class="ic" onclick="A.go('set')" aria-label="Cài đặt">⚙️</button></div>
 <div class="cd" style="margin-top:14px"><div class="row sp"><b>Today's progress</b><span>🔥 ${st} day streak</span></div><div class="big" style="margin:6px 0">${n} / ${S.goal} lượt học</div><div class="bar"><i style="width:${p}%"></i></div><div class="row sp sm mu" style="margin-top:10px"><span>⭐ Level ${lvl(S.xp)}</span><span>${S.xp||0} XP</span></div></div>
 <div class="g2">${t('📚',cnt(id=>!seen(id)),'New words')}${t('🔄',cnt(isDue),'Due for review')}${t('✅',cnt(mastered),'Mastered')}${t('🎯',S.reviews?accAll()+'%':'–','Accuracy')}</div>
 <button class="btn" onclick="startLearn()">Start Learning</button><button class="btn s" onclick="startQuiz()">Quick Quiz</button><button class="btn s" onclick="A.mist()">🔥 Review Mistakes (${cnt(wrongy)})</button><button class="btn s" onclick="A.go('words')">Vocabulary</button>`}
function mistView(){const ids=W.filter(w=>wrongy(w.id)).sort((a,b)=>cd(b.id).w-cd(a.id).w).map(w=>w.id);
 return `<h1>🔥 Words I Keep Getting Wrong</h1><p class="mu">Từ bạn sai từ 2 lần trở lên.</p>${ids.length?`<div class="g2"><button class="btn" style="margin:0" onclick="startLearn([${ids}],'Từ hay sai')">Flashcard</button><button class="btn" style="margin:0" onclick="startQuiz([${ids.slice(0,20)}])">Quiz</button></div><div class="cd" style="margin-top:12px">${ids.map(id=>`<div class="wi" role="button" tabindex="0"><div onclick="A.open(${id})"><b>${esc(W[id].word)}</b> <span class="mu sm">sai ${cd(id).w}</span><div class="mu sm">${esc(W[id].meaning)}</div></div><button class="ic" onclick="A.reset(${id})" aria-label="Reset từ">↺</button></div>`).join('')}</div>`:'<div class="cd">Chưa có từ nào 🎉</div>'}`}
function learnTab(){const d=cnt(isDue),n=cnt(id=>!seen(id));
 return `<h1>Learn</h1><div class="cd"><b>Học hôm nay</b><p class="mu">${d} từ cần ôn + từ mới theo mục tiêu ngày.</p><button class="btn" onclick="startLearn()">Start Learning</button></div><div class="cd"><b>Học theo bài</b>${TOPICS.map(t=>{const ids=W.filter(w=>w.topic===t),n=ids.filter(w=>seen(w.id)).length;return `<div class="wi" role="button" tabindex="0" onclick="A.byTopic('${t}')"><div style="flex:1"><b>${t}</b><div class="bar" style="margin-top:6px"><i style="width:${n/ids.length*100}%"></i></div></div><span class="mu sm">${n}/${ids.length}</span></div>`}).join('')}</div><div class="cd"><b>Ôn từ hay sai</b><button class="btn s" onclick="A.mist()">🔥 Review Mistakes</button></div><p class="mu sm">Còn ${n} từ chưa học.</p>`}
function setView(){return `<h1>Settings</h1><div class="cd"><b>Mục tiêu mỗi ngày</b><div class="gr">${[5,10,20,30].map(n=>`<button class="btn ${S.goal===n?'':'s'}" style="margin:0" onclick="S.goal=${n};save();render()">${n} từ</button>`).join('')}</div><input type="number" inputmode="numeric" min="1" placeholder="Tùy chỉnh (${S.goal})" onchange="S.goal=Math.max(1,+this.value||S.goal);save();render()"></div>
 <div class="cd"><b>Giao diện</b><select onchange="S.theme=this.value;save();applyTheme();render()">${[['auto','Tự động'],['light','Sáng'],['dark','Tối']].map(x=>`<option value="${x[0]}" ${S.theme===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
 <div class="cd"><b>Âm thanh</b><select aria-label="Phát âm" onchange="S.sound=this.value!=='0';S.auto=this.value==='2';save()"><option value="0" ${S.sound?'':'selected'}>Tắt phát âm</option><option value="1" ${S.sound&&!S.auto?'selected':''}>Bật (chạm để nghe)</option><option value="2" ${S.sound&&S.auto?'selected':''}>Tự phát âm khi hiện thẻ</option></select><select onchange="S.rate=+this.value;save();say('essential')">${[[.6,'Chậm'],[.9,'Bình thường'],[1.1,'Nhanh']].map(x=>`<option value="${x[0]}" ${S.rate===x[0]?'selected':''}>Tốc độ: ${x[1]}</option>`).join('')}</select></div>
 <div class="cd"><b>Sao lưu tiến trình</b><button class="btn" onclick="A.exp()">Export JSON</button><input type="file" accept=".json,application/json" onchange="A.impF(this)"><textarea id="ta" rows="3" placeholder="Hoặc dán JSON vào đây" style="width:100%;margin-top:8px;border-radius:14px;padding:10px;font:14px monospace;background:var(--cd);color:var(--tx);border:1.5px solid var(--bd)"></textarea><button class="btn s" onclick="A.impT()">Import từ văn bản</button></div>
 <button class="btn d" onclick="A.wipe()">Reset toàn bộ tiến trình</button>`}

/* ===== NAVIGATION + ACTIONS ===== */
const TABS=[['home','🏠','Home'],['learn','📚','Learn'],['quiz','🧠','Quiz'],['words','🔎','Words'],['stats','📊','Stats']];
function applyTheme(){const dk=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.t=dk?'dark':'light';document.querySelector('meta[name=theme-color]').content=dk?'#0B0F1A':'#4F46E5'}
function render(){const app=document.getElementById('app');
 const m={home:homeView,learn:()=>L?learnView():learnTab(),quiz:quizView,words:wordsView,stats:statsView,mist:mistView,set:setView};
 app.innerHTML=m[V]();app.style.animation='none';void app.offsetWidth;app.style.animation='';
 const tab=V==='mist'||V==='set'?'home':V;
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" aria-current="${t[0]===tab?'page':'false'}" onclick="A.go('${t[0]}')"><b aria-hidden="true">${t[1]}</b>${t[2]}</button>`).join('');
 if(V==='quiz'&&Q&&Q.a===null&&Q.qs[Q.i]&&Q.qs[Q.i].t===3){const e=document.getElementById('ty');if(e)e.focus()}
 if(V==='learn'&&L&&L.i<L.q.length&&!L.flip&&S.auto&&L.sp!==L.i){L.sp=L.i;say(W[L.q[L.i]].word)}
 if(V==='quiz'&&Q&&Q.a===null&&Q.qs[Q.i]&&Q.qs[Q.i].t===0&&Q.sp!==Q.i){Q.sp=Q.i;say(W[Q.qs[Q.i].id].word)}}
const A={
 go(v){if(v==='home'||(v==='learn'&&L&&L.i>=L.q.length))L=null;if(v==='quiz'&&Q&&Q.i>=Q.qs.length)Q=null;V=v;window.scrollTo(0,0);render()},
 flip(){L.flip=!L.flip;render()},
 gr(g){const id=L.q[L.i];grade(id,g);L.n++;if(g!=='again')L.ok++;else{L.again[id]=(L.again[id]||0)+1;if(L.again[id]<3)L.q.push(id)}L.i++;L.flip=false;render()},
 pick(k){if(Q.a!==null)return;Q.a=k;const q=Q.qs[Q.i];answered(q.o[k]===q.id||W[q.o[k]].meaning===W[q.id].meaning)},
 chk(){if(Q.a!==null)return;const v=document.getElementById('ty').value,n=s=>s.toLowerCase().replace(/\s+/g,' ').trim();Q.typed=v;Q.a=-1;const w=W[Q.qs[Q.i].id];answered(W.some(x=>x.meaning===w.meaning&&n(x.word)===n(v)))},
 next(){Q.i++;Q.a=null;Q.typed='';if(Q.i>=Q.qs.length){const n=Q.qs.length;S.qz.runs++;S.qz.q+=n;S.qz.ok+=Q.ok;S.qz.list.push(Math.round(Q.ok/n*100));S.qz.list=S.qz.list.slice(-20);save()}render()},
 rev(){const b=Q.bad.slice();Q=null;startLearn(b,'Review mistakes')},
 mist(){V='mist';L=null;render()},
 mquiz(){startQuiz(pickIds(10,W.filter(w=>wrongy(w.id)).map(w=>w.id)))},
 byTopic(t){startLearn(W.filter(w=>w.topic===t&&(!seen(w.id)||isDue(w.id))).map(w=>w.id),t)},
 list(){document.getElementById('lst').innerHTML=listHtml()},
 open(id){detail(id)},close(){$md().innerHTML=''},
 reset(id){if(confirm('Reset tiến trình của từ này?')){delete S.cards[id];save();A.close();render()}},
 exp(){const j=JSON.stringify(S),ta=document.getElementById('ta');ta.value=j;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='vocab-progress-'+day()+'.json';a.click()}catch(e){}alert('Đã xuất. Nếu tải file không được, hãy copy JSON trong ô văn bản.')},
 imp(t){try{const o=JSON.parse(t);if(!o||typeof o.cards!=='object')throw 0;S=merge(o);save();applyTheme();alert('Import thành công!');render()}catch(e){alert('File JSON không hợp lệ.')}},
 impT(){A.imp(document.getElementById('ta').value)},
 impF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>A.imp(r.result);r.readAsText(f)},
 wipe(){if(confirm('Xóa toàn bộ tiến trình học?')&&confirm('Chắc chắn chứ? Không thể hoàn tác.')){const th=S.theme;try{localStorage.removeItem(KEY)}catch(e){}load();S.theme=th;save();L=null;Q=null;A.go('home')}}
