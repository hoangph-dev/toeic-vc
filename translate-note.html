<!DOCTYPE html>
<html lang="vi" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate Note</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    padding: 24px;
    background-color: #fff;
    background-image:
      linear-gradient(#e5e7eb 1px, transparent 1px),
      linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  textarea {
    display: block; width: 100%; height: 100%; resize: none; padding: 16px;
    font-size: 17px; line-height: 1.7; font-family: inherit; color: #1f2328;
    background: #fff; border: 1px solid #f3f4f6; border-radius: 2px; outline: none;
  }

  #toggle {
    position: fixed; top: 40px; right: 40px; z-index: 5;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 10px; border-radius: 999px; cursor: pointer;
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em;
    background: #000; color: #fff; border: 1px solid #000;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    transition: background .2s, color .2s, transform .1s;
  }
  #toggle:active { transform: scale(.97); }
  #toggle .knob {
    width: 30px; height: 18px; border-radius: 999px; background: #fff; position: relative; transition: background .2s;
  }
  #toggle .knob::after {
    content: ""; position: absolute; top: 2px; left: 14px; width: 14px; height: 14px;
    border-radius: 50%; background: #000; transition: left .2s, background .2s;
  }
  #toggle.off { background: #fff; color: #000; }
  #toggle.off .knob { background: #000; }
  #toggle.off .knob::after { left: 2px; background: #fff; }

  #popup .main { font-weight: 600; }
  #popup .fam { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.18); font-size: 13px; }
  #popup .pos { opacity: .55; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
  #popup .row b { font-weight: 600; }
  #popup .row span { opacity: .8; }

  #popup {
    position: fixed; z-index: 10; max-width: min(420px, calc(100vw - 32px));
    background: #111827; color: #f9fafb;
    border-radius: 2px; padding: 10px 14px; font-size: 15px; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); display: none;
    max-height: 50vh; overflow: auto;
  }
</style>
</head>
<body>
<textarea id="editor" spellcheck="false"></textarea>
<button id="toggle" type="button" title="Bật/tắt dịch"><span class="knob"></span><span id="toggleLabel">Translate ON</span></button>
<div id="popup"></div>

<script>
const STORAGE_KEY = 'en-vi-editor:text';
const editor = document.getElementById('editor');
const popup = document.getElementById('popup');
const cache = new Map();

try { editor.value = localStorage.getItem(STORAGE_KEY) || ''; } catch {}
editor.addEventListener('input', () => {
  try { localStorage.setItem(STORAGE_KEY, editor.value); } catch {}
});

async function translate(text) {
  text = text.trim();
  if (!text) return '';
  if (cache.has(text)) return cache.get(text);
  let result;
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    result = data[0].map(x => x[0]).join('');
  } catch {
    const url = 'https://api.mymemory.translated.net/get?langpair=en|vi&q=' + encodeURIComponent(text.slice(0, 500));
    const res = await fetch(url);
    const data = await res.json();
    result = data.responseData.translatedText;
  }
  cache.set(text, result);
  return result;
}

function wordAt(text, pos) {
  const isWord = c => /[A-Za-z0-9'\-]/.test(c);
  let s = pos, e = pos;
  while (s > 0 && isWord(text[s - 1])) s--;
  while (e < text.length && isWord(text[e])) e++;
  return text.slice(s, e).replace(/^['\-]+|['\-]+$/g, '');
}
function paragraphAt(text, pos) {
  const s = text.lastIndexOf('\n', pos - 1) + 1;
  let e = text.indexOf('\n', pos);
  if (e === -1) e = text.length;
  return text.slice(s, e);
}

const toggle = document.getElementById('toggle');
const toggleLabel = document.getElementById('toggleLabel');
let enabled = true;
try { enabled = localStorage.getItem('en-vi-editor:enabled') !== '0'; } catch {}
function renderToggle() {
  toggle.classList.toggle('off', !enabled);
  toggleLabel.textContent = enabled ? 'Translate ON' : 'Translate OFF';
}
renderToggle();
toggle.addEventListener('click', () => {
  enabled = !enabled;
  try { localStorage.setItem('en-vi-editor:enabled', enabled ? '1' : '0'); } catch {}
  renderToggle();
  if (!enabled) hidePopup();
  editor.focus();
});

// ---------- Word family ----------
const POS_LABEL = { n: 'Danh từ', v: 'Động từ', adj: 'Tính từ', adv: 'Trạng từ' };
const SUFFIXES = ['ization','isation','ations','ation','ition','ision','ssion','tion','sion','ments','ment','ness','ities','ity','ally','ically','ful','less','ous','ious','ive','ative','able','ible','al','ial','ic','ical','ly','ing','ed','er','or','ist','ize','ise','ify','en','y','ant','ent','ance','ence','ure','age','ship','s'];
function stemOf(w) {
  for (const suf of [...SUFFIXES].sort((a, b) => b.length - a.length)) {
    if (w.length - suf.length >= 4 && w.endsWith(suf)) { w = w.slice(0, -suf.length); break; }
  }
  return w.replace(/(i|e)$/, '');
}
async function wordFamily(word) {
  word = word.toLowerCase();
  const stem = stemOf(word);
  if (stem.length < 3) return {};
  const res = await fetch('https://api.datamuse.com/words?md=p&max=200&sp=' + encodeURIComponent(stem + '*'));
  const list = await res.json();
  const groups = {};
  const seen = new Set();
  const add = (w, pos) => {
    if (seen.has(w + pos)) return;
    seen.add(w + pos);
    (groups[pos] ||= []).push(w);
  };
  for (const { word: w, tags = [] } of list) {
    if (/[^a-z]/.test(w) || w.length > word.length + 6) continue;
    const isInput = w === word;
    if (!isInput && /(s|ed)$/.test(w)) continue;
    for (const t of tags) {
      if (!POS_LABEL[t]) continue;
      if (!isInput && w.endsWith('ing') && t !== 'adj') continue;
      if (!isInput && w.endsWith('ly') && t !== 'adv') continue;
      add(w, t);
    }
  }
  for (const k in groups) groups[k] = groups[k].sort((a, b) => a.length - b.length).slice(0, 3);
  return groups;
}
async function translateMany(words) {
  try {
    const out = (await translate(words.join('\n'))).split('\n').map(x => x.trim());
    if (out.length === words.length) return out;
  } catch {}
  return Promise.all(words.map(w => translate(w).catch(() => '')));
}

function showPopup(text, x, y, family) {
  popup.textContent = '';
  const main = document.createElement('div');
  main.className = 'main';
  main.textContent = text;
  popup.appendChild(main);
  if (family) {
    const box = document.createElement('div');
    box.className = 'fam';
    for (const pos of ['n', 'v', 'adj', 'adv']) {
      if (!family[pos]) continue;
      const h = document.createElement('div');
      h.className = 'pos';
      h.textContent = POS_LABEL[pos];
      box.appendChild(h);
      for (const [w, vi] of family[pos]) {
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('b'); b.textContent = w;
        const sp = document.createElement('span'); sp.textContent = ' — ' + vi;
        row.append(b, sp);
        box.appendChild(row);
      }
    }
    if (box.children.length) popup.appendChild(box);
  }
  popup.style.display = 'block';
  const r = popup.getBoundingClientRect();
  const left = Math.min(x, window.innerWidth - r.width - 16);
  let top = y + 18;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 12;
  popup.style.left = Math.max(16, left) + 'px';
  popup.style.top = Math.max(8, top) + 'px';
}
function hidePopup() { popup.style.display = 'none'; }

let reqId = 0;
async function translateAndShow(src, x, y) {
  src = src.trim();
  if (!src || !enabled) return;
  const id = ++reqId;
  showPopup('Đang dịch...', x, y);
  try {
    const vi = await translate(src);
    if (id !== reqId) return;
    showPopup(src + ' — ' + vi, x, y);
    if (!/^[A-Za-z][A-Za-z'\-]*$/.test(src)) return;
    const groups = await wordFamily(src);
    const flat = Object.entries(groups).flatMap(([pos, ws]) => ws.map(w => [pos, w]));
    if (!flat.length) return;
    const meanings = await translateMany(flat.map(f => f[1]));
    if (id !== reqId) return;
    const family = {};
    flat.forEach(([pos, w], i) => (family[pos] ||= []).push([w, meanings[i]]));
    showPopup(src + ' — ' + vi, x, y, family);
  } catch {
    if (id === reqId) showPopup('⚠️ Lỗi dịch. Kiểm tra kết nối mạng.', x, y);
  }
}

editor.addEventListener('mouseup', (e) => {
  setTimeout(() => {
    const { selectionStart: a, selectionEnd: b, value } = editor;
    if (a !== b) return translateAndShow(value.slice(a, b), e.clientX, e.clientY);
    if (e.altKey || e.ctrlKey || e.metaKey) {
      translateAndShow(paragraphAt(value, a), e.clientX, e.clientY);
    } else {
      const w = wordAt(value, a);
      if (/[A-Za-z]/.test(w)) translateAndShow(w, e.clientX, e.clientY);
      else hidePopup();
    }
  }, 0);
});
editor.addEventListener('keydown', (e) => { if (e.key !== 'Escape') hidePopup(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePopup(); });
document.addEventListener('mousedown', (e) => {
  if (!popup.contains(e.target) && e.target !== editor && e.target !== toggle && !toggle.contains(e.target)) hidePopup();
});

// Chặn extension dịch bên ngoài bắt sự kiện double-click / chuột phải trên trang này
for (const type of ['dblclick', 'contextmenu']) {
  window.addEventListener(type, (e) => e.stopImmediatePropagation(), true);
}
</script>
</body>
</html>
