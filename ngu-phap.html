<script>
const DB={"cores": [{"id": "P0.1", "title": "Subject (Chủ ngữ)", "group": "P0", "priority": "P0", "rule": "Subject là người/vật/sự việc được nói đến trong câu. Cấu trúc mẫu: `S + V`.", "example": "`The manager works.` → `The manager` là S.", "trap": "`The manager of the stores works.` → S chính là `The manager`, không phải `stores`.", "passText": "Xác định đúng S trong ít nhất 9/10 câu ngắn và câu có cụm giới từ.", "hint": "", "recognition": "Tìm ai/cái gì thực hiện hành động hoặc đang có trạng thái.", "requires": [], "threshold": 9}, {"id": "P0.2", "title": "Verb (Động từ)", "group": "P0", "priority": "P0", "rule": "Động từ diễn tả hành động/trạng thái; phân biệt động từ chính và trợ động từ cơ bản.", "example": "`She reviews reports.` → `reviews` là V chính; `She is reviewing reports.` → `is reviewing` là cụm động từ.", "trap": "`a review` là danh từ, `to review` là động từ nguyên mẫu.", "passText": "Nhận ra động từ chính/cụm động từ trong ít nhất 9/10 câu.", "hint": "", "recognition": "", "requires": ["P0.1"], "threshold": 9}, {"id": "P0.3", "title": "Object (Tân ngữ)", "group": "P0", "priority": "P0", "rule": "Object trả lời cho câu hỏi “làm gì với ai/cái gì” trong mẫu `S + V + O` của động từ có tân ngữ.", "example": "`She reviews the report.` → `the report` là O.", "trap": "Không phải động từ nào cũng cần tân ngữ: `The meeting started.`", "passText": "Phân biệt S/V/O ở ít nhất 9/10 câu mẫu.", "hint": "", "recognition": "", "requires": ["P0.1", "P0.2"], "threshold": 9}, {"id": "P0.4", "title": "Noun Phrase (Cụm danh từ)", "group": "P0", "priority": "P0", "rule": "`a/an/the + (ADV) + ADJ + N` là một mẫu phổ biến; xác định được head noun (danh từ chính).", "example": "`a very important meeting` → `meeting` là head noun; `very` bổ nghĩa `important`.", "trap": "Không phải mọi danh từ đều cần mạo từ; danh từ số nhiều và danh từ không đếm được có quy tắc riêng.", "passText": "Xác định head noun và vai trò ADJ/ADV trong ít nhất 9/10 cụm.", "hint": "", "recognition": "", "requires": ["P0.1"], "threshold": 9}, {"id": "P0.5", "title": "Clause vs Phrase (Mệnh đề và cụm từ)", "group": "P0", "priority": "P0", "rule": "Clause thường có S + V; phrase không có cặp chủ ngữ + động từ chia thì đầy đủ.", "example": "`because it rained` (clause) vs `because of the rain` (prepositional phrase).", "trap": "Mệnh đề phụ không nhất thiết đứng độc lập thành câu hoàn chỉnh.", "passText": "Phân loại đúng ít nhất 9/10 ví dụ phrase/clause.", "hint": "", "recognition": "", "requires": ["P0.1", "P0.2"], "threshold": 9}, {"id": "WF-01", "title": "Noun (N)", "group": "WF", "priority": "P1", "rule": "Danh từ làm chủ ngữ/tân ngữ; thường sau `a/an/the`, `my/our/their`, tính từ; `ADJ + N`.", "example": "`The manager made a decision.`", "trap": "`equipment`, `information` thường không đếm được; không suy luận từ `the + ___` luôn là N (vì có thể `the + ADJ + N`).", "passText": "≥8/10 câu nhận diện vị trí N.", "hint": "", "recognition": "", "requires": ["P0.4"], "threshold": 8}, {"id": "WF-02", "title": "Verb (V)", "group": "WF", "priority": "P1", "rule": "Mệnh đề cần động từ chính; `S + V`; sau modal là bare infinitive.", "example": "`The company will expand its operations.`", "trap": "Danh từ và động từ có thể cùng hình thức như `plan`, `review`, `increase`.", "passText": "≥8/10 câu phân biệt vị trí V/N.", "hint": "", "recognition": "", "requires": ["P0.2"], "threshold": 8}, {"id": "WF-03", "title": "Adjective (ADJ)", "group": "WF", "priority": "P1", "rule": "ADJ thường đứng trước N hoặc sau linking verbs như `be`, `become`, `seem`.", "example": "`a successful project`; `The proposal is important.`", "trap": "`is` không mặc định yêu cầu V-ing; `is + ADJ` cũng đúng. Các từ `-ed/-ing` có thể là tính từ.", "passText": "≥8/10 câu xác định vị trí ADJ.", "hint": "", "recognition": "", "requires": ["WF-01", "P0.4"], "threshold": 8}, {"id": "WF-04", "title": "Adverb (ADV)", "group": "WF", "priority": "P1", "rule": "ADV bổ nghĩa V/ADJ/ADV hoặc cả câu; nhiều từ kết thúc `-ly`.", "example": "`The team worked efficiently.`; `a highly successful product`.", "trap": "Không phải mọi từ `-ly` đều là ADV (`friendly` là ADJ); không phải mọi ADV đều có `-ly` (`fast`).", "passText": "≥8/10 câu phân biệt ADJ/ADV.", "hint": "", "recognition": "", "requires": ["WF-02", "WF-03"], "threshold": 8}, {"id": "WF-05", "title": "Word Family (Gia đình từ)", "group": "WF", "priority": "P1", "rule": "Nhận biết các từ cùng gốc nhưng khác chức năng.", "example": "`success (N) / succeed (V) / successful (ADJ) / successfully (ADV)`; `consider / consideration / considerable / considerably` (nhận biết nghĩa thay đổi).", "trap": "Từ cùng gốc **không** có nghĩa hoàn toàn giống nhau: `consider` = cân nhắc, `considerable` = đáng kể.", "passText": "≥8/10 câu chọn đúng loại từ trong family.", "hint": "", "recognition": "", "requires": ["WF-01", "WF-02", "WF-03", "WF-04"], "threshold": 8}, {"id": "WF-06", "title": "Suffix (Hậu tố)", "group": "WF", "priority": "P1", "rule": "Nhận diện xu hướng: N `-tion, -ment, -ness, -ity`; ADJ `-ive, -al, -ful, -able`; ADV `-ly`; người/đơn vị `-er, -or`.", "example": "`development` (N), `effective` (ADJ), `effectively` (ADV).", "trap": "Suffix chỉ là tín hiệu; có ngoại lệ và có thể trùng dạng.", "passText": "≥8/10 câu nhận diện từ loại từ suffix kết hợp vị trí trong câu.", "hint": "", "recognition": "", "requires": ["WF-05"], "threshold": 8}, {"id": "VB-01", "title": "Subject–Verb Agreement", "group": "VB", "priority": "P1", "rule": "Present Simple: S số ít ngôi 3 → V-s/es; S số nhiều → V nguyên mẫu. `each/every + N số ít` thường đi với V số ít.", "example": "`Each employee works.` / `The employees work.`", "trap": "Cụm chen giữa không đổi chủ ngữ: `The manager of the stores is here.`", "passText": "≥9/10 câu lần đầu và ôn lại.", "hint": "", "recognition": "", "requires": ["P0.1", "P0.2"], "threshold": 9}, {"id": "VB-02", "title": "Present Simple", "group": "VB", "priority": "P1", "rule": "`S + V(s/es)`; thói quen, lịch, sự thật.", "example": "`The store opens at 9 A.M.`", "trap": "Chủ ngữ số ít/số nhiều và câu phủ định với `does not + V`.", "passText": "≥8/10.", "hint": "`usually, often, every day` (không phải dấu hiệu tuyệt đối).", "recognition": "", "requires": ["VB-01"], "threshold": 8}, {"id": "VB-03", "title": "Past Simple", "group": "VB", "priority": "P1", "rule": "`S + V2/ed`; hành động đã kết thúc trong quá khứ.", "example": "`The company opened a new office last year.`", "trap": "Bất quy tắc (`send → sent`, `make → made`); câu hỏi/phủ định `did + V`.", "passText": "≥8/10.", "hint": "`yesterday, last week, in 2020`.", "recognition": "", "requires": ["VB-01"], "threshold": 8}, {"id": "VB-04", "title": "Future Simple", "group": "VB", "priority": "P1", "rule": "`S + will + V`; dự định/quyết định/dự đoán về tương lai (tùy ngữ cảnh).", "example": "`The director will attend the meeting.`", "trap": "Sau `will` dùng V nguyên mẫu; trong mệnh đề thời gian/điều kiện tương lai thường dùng hiện tại đơn: `When she arrives, we will start.`", "passText": "≥8/10.", "hint": "`tomorrow, next month`.", "recognition": "", "requires": ["VB-01"], "threshold": 8}, {"id": "VB-05", "title": "Present Continuous", "group": "VB", "priority": "P1", "rule": "`S + am/is/are + V-ing`; sự việc đang diễn ra hoặc tình huống tạm thời.", "example": "`The manager is reviewing the budget.`", "trap": "`be + ADJ`, `be + V3` cũng đúng nhưng khác chức năng.", "passText": "≥8/10, nhận diện được chủ động.", "hint": "", "recognition": "", "requires": ["VB-01", "WF-02"], "threshold": 8}, {"id": "VB-06", "title": "Present Perfect", "group": "VB", "priority": "P1", "rule": "`S + have/has + V3`; trải nghiệm/kết quả còn liên quan hiện tại hoặc hành động kéo dài đến hiện tại.", "example": "`The team has completed the report.`", "trap": "`have/has` có thể là động từ chính: `She has a laptop.`", "passText": "≥8/10.", "hint": "`since, for, already, recently` (phải đọc ngữ cảnh).", "recognition": "", "requires": ["VB-03"], "threshold": 8}, {"id": "VB-07", "title": "Passive Voice", "group": "VB", "priority": "P1", "rule": "`S + be + V3`; S là đối tượng nhận hành động. Mở rộng: `was/were + V3`, `will be + V3`, `has/have been + V3`.", "example": "`The contract was signed yesterday.` / `The report is reviewed by the manager.`", "trap": "Đừng coi mọi `be + V3` đều chỉ sự kiện bị động đang diễn ra; có trường hợp mang tính trạng thái. Phân biệt với `be + V-ing`.", "passText": "≥9/10 câu phân biệt active/passive, lần đầu và ôn lại.", "hint": "", "recognition": "", "requires": ["VB-05", "VB-03"], "threshold": 9}, {"id": "VB-08", "title": "Modal Verbs", "group": "VB", "priority": "P1", "rule": "`can/could/may/might/must/should/will/would + V nguyên mẫu`.", "example": "`Employees must submit the form.`", "trap": "Không viết `must submits`; dạng bị động có thể là `must be submitted`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["WF-02"], "threshold": 8}, {"id": "VB-09", "title": "To V / V-ing / Bare Infinitive", "group": "VB", "priority": "P1", "rule": "Nhớ một số patterns: `decide/plan/agree + to V`; `avoid/enjoy/finish + V-ing`; `let/make + O + V`; `look forward to + V-ing`.", "example": "`We plan to expand.` / `They avoided making mistakes.`", "trap": "`to` có thể là giới từ, như `look forward to meeting you`, chứ không luôn là dấu hiệu `to V`.", "passText": "≥9/10 câu lần đầu và ôn lại.", "hint": "", "recognition": "", "requires": ["P0.2", "WF-02"], "threshold": 9}, {"id": "VB-10", "title": "Past Perfect (Basic)", "group": "VB", "priority": "P1", "rule": "`S + had + V3`, sự việc hoàn thành trước một mốc/sự việc quá khứ khác.", "example": "`The meeting had ended before I arrived.`", "trap": "Không dùng past perfect chỉ vì có hai sự việc quá khứ; cần hiểu quan hệ thời gian.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["VB-03", "VB-06"], "threshold": 8}, {"id": "PD-01", "title": "Subject / Object Pronouns", "group": "PD", "priority": "P1", "rule": "Chủ ngữ: `I, you, he, she, it, we, they`. Tân ngữ: `me, you, him, her, it, us, them`.", "example": "`She called him.`", "trap": "Sau giới từ thường dùng object pronoun: `for them`.", "passText": "≥9/10.", "hint": "", "recognition": "", "requires": ["P0.1", "P0.3"], "threshold": 9}, {"id": "PD-02", "title": "Possessive Adjectives / Pronouns", "group": "PD", "priority": "P1", "rule": "`my/your/his/her/its/our/their + N`; đại từ sở hữu `mine/yours/his/hers/ours/theirs` đứng độc lập.", "example": "`their reports` / `The reports are theirs.`", "trap": "`its` (sở hữu) khác `it's` (= it is/it has).", "passText": "≥9/10.", "hint": "", "recognition": "", "requires": ["P0.4", "PD-01"], "threshold": 9}, {"id": "PD-03", "title": "Reflexive Pronouns", "group": "PD", "priority": "P1", "rule": "`myself, yourself, himself, herself, itself, ourselves, yourselves, themselves`.", "example": "`She prepared the presentation herself.`", "trap": "Không dùng reflexive pronoun thay cho subject/object pronoun bình thường.", "passText": "≥9/10.", "hint": "", "recognition": "", "requires": ["PD-01"], "threshold": 9}, {"id": "PD-04", "title": "Articles", "group": "PD", "priority": "P1", "rule": "`a/an` với danh từ đếm được số ít chưa xác định; `the` khi xác định; biết trường hợp danh từ không cần article.", "example": "`an agreement` / `the agreement we signed`.", "trap": "`a/an` dựa vào **âm đầu** (`an hour`, `a university`), không chỉ chữ cái.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.4", "WF-01"], "threshold": 8}, {"id": "PD-05", "title": "Countable / Uncountable Nouns", "group": "PD", "priority": "P1", "rule": "N số ít/số nhiều; danh từ không đếm được phổ biến: `information`, `equipment`, `advice`, `furniture`.", "example": "`some equipment`, không dùng `an equipment` theo nghĩa thông thường.", "trap": "`information` không thêm `-s` khi dùng theo nghĩa thông thường.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["WF-01"], "threshold": 8}, {"id": "PD-06", "title": "Quantifiers", "group": "PD", "priority": "P1", "rule": "`many/few/a few + N đếm được số nhiều`; `much/little/a little + N không đếm được`; `some/any/all/each/every`.", "example": "`many employees`; `much information`.", "trap": "Phân biệt `few` (ít, gần như không đủ) và `a few` (một vài); `each/every + N số ít` trong mẫu thông dụng.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["PD-05"], "threshold": 8}, {"id": "CP-01", "title": "because / because of", "group": "CP", "priority": "P1", "rule": "`because + clause`; `because of + noun phrase / V-ing phrase`.", "example": "`because it rained` / `because of the rain`.", "trap": "Không viết `because of it rained`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5"], "threshold": 8}, {"id": "CP-02", "title": "although / despite / in spite of", "group": "CP", "priority": "P1", "rule": "`although + clause`; `despite / in spite of + N / V-ing`.", "example": "`Although it rained, we went out.` / `Despite the rain, we went out.`", "trap": "`despite of` là sai; đúng là `despite` hoặc `in spite of`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5"], "threshold": 8}, {"id": "CP-03", "title": "while / during", "group": "CP", "priority": "P1", "rule": "`while + clause`; `during + noun phrase`.", "example": "`while we were meeting` / `during the meeting`.", "trap": "Không dùng `during we met`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5"], "threshold": 8}, {"id": "CP-04", "title": "if / unless / when", "group": "CP", "priority": "P1", "rule": "`if = nếu`; `unless = trừ khi/nếu không`; `when = khi`. Trong điều kiện thực ở tương lai: `If + present, will + V`.", "example": "`If it rains, we will postpone the tour.`", "trap": "`unless` không phải cách thay thế máy móc cho `if`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5", "VB-02", "VB-04"], "threshold": 8}, {"id": "CP-05", "title": "in / on / at / by / until", "group": "CP", "priority": "P1", "rule": "Thời gian: `in October`, `on Monday`, `at 9 A.M.`; `by Friday` = chậm nhất thứ Sáu; `until Friday` = kéo dài đến thứ Sáu.", "example": "`Submit the report by Friday.`", "trap": "`by` khác `until`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.4"], "threshold": 8}, {"id": "CP-06", "title": "for / since / from / to", "group": "CP", "priority": "P1", "rule": "`for + khoảng thời gian`; `since + mốc`; `from ... to ...` chỉ khoảng/điểm đầu-cuối.", "example": "`for two years`; `since 2024`; `from Monday to Friday`.", "trap": "`for` không đồng nghĩa `since`.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["CP-05", "VB-06"], "threshold": 8}, {"id": "CP-07", "title": "Common Preposition Phrases", "group": "CP", "priority": "P1", "rule": "Học cụm: `responsible for`, `interested in`, `according to`, `participate in`, `depend on`, `apply for`.", "example": "`She is responsible for scheduling meetings.`", "trap": "Không dịch giới từ từng chữ; học cả collocation.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["CP-05"], "threshold": 8}, {"id": "SE-01", "title": "Relative Clauses", "group": "SE", "priority": "P2", "rule": "`who` (người), `which` (vật/sự việc), `that` (người/vật trong mệnh đề xác định), `whose` (sở hữu), `where` (địa điểm).", "example": "`The employee who joined yesterday is here.`", "trap": "`where` không thay thế mọi `which`; phân biệt vị trí đại từ quan hệ trong câu.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5", "PD-01"], "threshold": 8}, {"id": "SE-02", "title": "Comparatives / Superlatives", "group": "SE", "priority": "P2", "rule": "`-er / more + ADJ`, `-est / most + ADJ`, `as ... as`, `than`.", "example": "`This process is more efficient than the old one.`", "trap": "`more better` là sai; phân biệt ADJ/ADV trong so sánh.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["WF-03", "WF-04"], "threshold": 8}, {"id": "SE-03", "title": "Participles: V-ing / V3; -ed / -ing Adjectives", "group": "SE", "priority": "P2", "rule": "V-ing thường mang nghĩa chủ động hoặc gây ra cảm giác; V3 thường mang nghĩa bị động/đã được tác động; -ed ADJ thường mô tả cảm giác người/vật trải nghiệm.", "example": "`a revised document`; `an interesting presentation`; `interested employees`.", "trap": "Đừng áp dụng cứng nhắc công thức V-ing = chủ động, V3 = bị động cho mọi adjective; kiểm tra nghĩa thực tế.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["VB-07", "WF-03"], "threshold": 8}, {"id": "SE-04", "title": "Parallel Structure", "group": "SE", "priority": "P2", "rule": "Hai hoặc nhiều thành phần nối bởi `and/or` nên tương đồng về cấu trúc.", "example": "`planning, organizing, and reviewing projects`.", "trap": "`to plan and organizing` thường sai khi cùng vai trò song song.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["WF-02", "VB-09"], "threshold": 8}, {"id": "SE-05", "title": "Basic Conditionals", "group": "SE", "priority": "P2", "rule": "Type 1: `If + present, will + V`; type 2: `If + past, would + V`; làm quen zero conditional.", "example": "`If the supplier arrives late, we will reschedule.`", "trap": "Type 2 diễn tả giả định, không nhất thiết sự kiện quá khứ.", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["CP-04"], "threshold": 8}, {"id": "SE-06", "title": "Basic Noun Clauses", "group": "SE", "priority": "P2", "rule": "`that / whether / if / what` trong mệnh đề đóng vai trò danh từ.", "example": "`Please confirm whether the shipment has arrived.`", "trap": "Trật tự câu kể trong mệnh đề hỏi gián tiếp: `where the office is` (không phải `where is the office` trong cấu trúc này).", "passText": "≥8/10.", "hint": "", "recognition": "", "requires": ["P0.5", "SE-01"], "threshold": 8}], "groups": [{"id": "P0", "en": "Sentence Foundation", "vi": "Nền tảng câu", "priority": "Gốc", "color": "#008f85"}, {"id": "WF", "en": "Word Forms", "vi": "Từ loại", "priority": "P1", "color": "#297fce"}, {"id": "VB", "en": "Verb System", "vi": "Hệ thống động từ", "priority": "P1", "color": "#7159cc"}, {"id": "PD", "en": "Pronouns \u0026 Determiners", "vi": "Đại từ \u0026 từ hạn định", "priority": "P1", "color": "#d98b37"}, {"id": "CP", "en": "Connectors \u0026 Prepositions", "vi": "Liên từ \u0026 giới từ", "priority": "P1", "color": "#c15f8f"}, {"id": "SE", "en": "Sentence Expansion", "vi": "Mở rộng câu", "priority": "P2", "color": "#58758c"}], "mini": {"P0.1": {"stem": "In “The director of the company works here”, what is the main subject?", "options": ["The director", "the company", "works", "here"], "answer": 0, "explanation": "“of the company” bổ nghĩa cho director, không phải chủ ngữ chính."}, "P0.2": {"stem": "In “The team is preparing the report”, which is the verb phrase?", "options": ["The team", "is preparing", "the report", "preparing the"], "answer": 1, "explanation": "is preparing là cụm động từ."}, "P0.3": {"stem": "In “She reviewed the contract”, what is the object?", "options": ["She", "reviewed", "the contract", "No object"], "answer": 2, "explanation": "the contract nhận tác động của reviewed."}, "P0.4": {"stem": "What is the head noun of “a very important meeting”?", "options": ["very", "important", "meeting", "a"], "answer": 2, "explanation": "meeting là danh từ chính của cụm."}, "P0.5": {"stem": "Which expression contains a subject and a finite verb?", "options": ["because of the rain", "during the meeting", "because it rained", "after lunch"], "answer": 2, "explanation": "it rained có chủ ngữ và động từ chia thì."}, "WF-01": {"stem": "The manager made an important ______.", "options": ["decide", "decision", "decisive", "decisively"], "answer": 1, "explanation": "Sau an important cần danh từ decision."}, "WF-02": {"stem": "The company will ______ its operations.", "options": ["expansion", "expansive", "expand", "expanding"], "answer": 2, "explanation": "will + động từ nguyên mẫu expand."}, "WF-03": {"stem": "The company hired a ______ designer.", "options": ["profession", "professional", "professionally", "professionalism"], "answer": 1, "explanation": "professional là tính từ bổ nghĩa designer."}, "WF-04": {"stem": "The new system operates ______.", "options": ["efficient", "efficiency", "efficiently", "efficiencies"], "answer": 2, "explanation": "efficiently bổ nghĩa cho operates."}, "WF-05": {"stem": "The new product was launched ______.", "options": ["success", "succeed", "successful", "successfully"], "answer": 3, "explanation": "Cần trạng từ successfully bổ nghĩa was launched."}, "WF-06": {"stem": "The company announced a major ______ in its services.", "options": ["improve", "improvement", "improved", "improving"], "answer": 1, "explanation": "Sau a major cần danh từ improvement (-ment)."}, "VB-01": {"stem": "Each employee ______ an identification card.", "options": ["need", "needs", "needing", "to need"], "answer": 1, "explanation": "Each employee là chủ ngữ số ít: needs."}, "VB-02": {"stem": "The store usually ______ at nine.", "options": ["open", "opens", "opening", "opened"], "answer": 1, "explanation": "usually diễn tả thói quen, store số ít → opens."}, "VB-03": {"stem": "The company ______ a new office last year.", "options": ["opens", "opening", "opened", "will open"], "answer": 2, "explanation": "last year → quá khứ đơn opened."}, "VB-04": {"stem": "The director will ______ the meeting tomorrow.", "options": ["attends", "attended", "attend", "attending"], "answer": 2, "explanation": "will + V nguyên mẫu."}, "VB-05": {"stem": "The manager is ______ the budget right now.", "options": ["review", "reviewed", "reviewing", "reviews"], "answer": 2, "explanation": "is + V-ing và chủ ngữ đang thực hiện hành động."}, "VB-06": {"stem": "The team has already ______ the report.", "options": ["complete", "completed", "completing", "completion"], "answer": 1, "explanation": "has + V3 = has completed."}, "VB-07": {"stem": "The documents ______ yesterday.", "options": ["send", "sent", "were sent", "sending"], "answer": 2, "explanation": "documents nhận hành động gửi: were + V3."}, "VB-08": {"stem": "Employees must ______ the form.", "options": ["submits", "submitted", "submitting", "submit"], "answer": 3, "explanation": "must + V nguyên mẫu."}, "VB-09": {"stem": "We look forward to ______ you.", "options": ["meet", "meeting", "met", "meets"], "answer": 1, "explanation": "look forward to + V-ing."}, "VB-10": {"stem": "The meeting had ______ before I arrived.", "options": ["end", "ended", "ending", "ends"], "answer": 1, "explanation": "had + V3."}, "PD-01": {"stem": "Please contact ______ before Friday.", "options": ["he", "him", "his", "himself"], "answer": 1, "explanation": "Động từ contact cần tân ngữ him."}, "PD-02": {"stem": "All employees must bring ______ ID cards.", "options": ["they", "them", "their", "theirs"], "answer": 2, "explanation": "their bổ nghĩa ID cards."}, "PD-03": {"stem": "She prepared the presentation ______.", "options": ["hers", "herself", "her", "she"], "answer": 1, "explanation": "herself nhấn mạnh tự mình thực hiện."}, "PD-04": {"stem": "We signed ______ agreement yesterday.", "options": ["a", "an", "any", "some"], "answer": 1, "explanation": "agreement bắt đầu bằng âm nguyên âm, an agreement."}, "PD-05": {"stem": "Please send me some ______.", "options": ["informations", "information", "an information", "informing"], "answer": 1, "explanation": "information không đếm được."}, "PD-06": {"stem": "We have ______ employees at this location.", "options": ["much", "many", "little", "any of"], "answer": 1, "explanation": "many + danh từ đếm được số nhiều."}, "CP-01": {"stem": "The event was canceled ______ the bad weather.", "options": ["because", "because of", "although", "while"], "answer": 1, "explanation": "because of + noun phrase."}, "CP-02": {"stem": "______ the heavy rain, the event continued.", "options": ["Although", "Despite", "Because", "While"], "answer": 1, "explanation": "despite + noun phrase."}, "CP-03": {"stem": "Employees should remain quiet ______ the presentation.", "options": ["while", "during", "although", "unless"], "answer": 1, "explanation": "during + noun phrase."}, "CP-04": {"stem": "______ it rains, we will postpone the tour.", "options": ["Unless", "Despite", "If", "During"], "answer": 2, "explanation": "If + hiện tại đơn, will + V."}, "CP-05": {"stem": "Please submit your report ______ Friday.", "options": ["until", "by", "on until", "during"], "answer": 1, "explanation": "by Friday = chậm nhất thứ Sáu."}, "CP-06": {"stem": "She has worked here ______ 2022.", "options": ["for", "during", "since", "from"], "answer": 2, "explanation": "since + mốc thời gian."}, "CP-07": {"stem": "She is responsible ______ organizing meetings.", "options": ["in", "for", "at", "to"], "answer": 1, "explanation": "responsible for."}, "SE-01": {"stem": "The employee ______ joined yesterday is here.", "options": ["where", "who", "whose", "when"], "answer": 1, "explanation": "who thay thế người làm chủ ngữ của mệnh đề quan hệ."}, "SE-02": {"stem": "This software is ______ than the old version.", "options": ["efficient", "most efficient", "more efficient", "efficiency"], "answer": 2, "explanation": "So sánh hơn: more efficient than."}, "SE-03": {"stem": "Please use the ______ document.", "options": ["revising", "revised", "revision", "revise"], "answer": 1, "explanation": "revised = đã được chỉnh sửa."}, "SE-04": {"stem": "Her duties include planning, organizing, and ______ events.", "options": ["coordinate", "coordinating", "coordinated", "to coordinate"], "answer": 1, "explanation": "Cấu trúc song song: planning, organizing, coordinating."}, "SE-05": {"stem": "If the supplier arrives late, we ______ the meeting.", "options": ["reschedule", "rescheduled", "will reschedule", "rescheduling"], "answer": 2, "explanation": "If + hiện tại đơn, will + V cho điều kiện thực ở tương lai."}, "SE-06": {"stem": "Please confirm ______ the shipment has arrived.", "options": ["whether", "where is", "what does", "which is"], "answer": 0, "explanation": "whether + S + V trong mệnh đề danh từ."}}, "full": "\u003ch1\u003eTOEIC PART 5 — ROADMAP HỌC TỪ CORE ĐẾN LUYỆN ĐỀ\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eĐối tượng:\u003c/strong\u003e Người học có điểm Reading hiện tại khoảng \u003cstrong\u003e135/495\u003c/strong\u003e, mục tiêu \u003cstrong\u003eTOEIC tổng 600+\u003c/strong\u003e.\u003cbr /\u003e\n\u003cstrong\u003ePhạm vi:\u003c/strong\u003e Grammar trọng tâm Part 5, vocabulary chọn lọc, luyện tập và kiểm tra năng lực theo từng core.\u003cbr /\u003e\n\u003cstrong\u003eNguyên tắc:\u003c/strong\u003e \u003cem\u003eKhông học toàn bộ ngữ pháp tiếng Anh. Học đủ sâu để nhận diện và giải đúng các dạng Part 5 ưu tiên cao.\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003e0. Hướng dẫn dùng tài liệu này\u003c/h2\u003e\n\u003cp\u003eĐây là \u003cstrong\u003ebản roadmap / đặc tả nội dung\u003c/strong\u003e để có thể chuyển thành website học từng bước. Tài liệu xác định \u003cstrong\u003ehọc gì, thứ tự nào, ví dụ, bẫy và điều kiện PASS\u003c/strong\u003e. Nó \u003cstrong\u003echưa phải\u003c/strong\u003e bộ giáo án đầy đủ hoặc ngân hàng 10–20 câu hỏi có đáp án giải thích cho \u003cem\u003emọi\u003c/em\u003e core; phần đó cần bổ sung khi xây nội dung bài học.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eP0 — Foundation:\u003c/strong\u003e Kiến thức gốc, bắt buộc trước P1.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eP1 — High Priority:\u003c/strong\u003e Trọng tâm lấy điểm ngữ pháp.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eP2 — Medium Priority:\u003c/strong\u003e Mở rộng độ bao phủ cho câu dài và cấu trúc khó hơn.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eP3 — Deferred:\u003c/strong\u003e Hoãn học nếu thời gian hạn chế.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVocabulary:\u003c/strong\u003e Chọn lọc để hỗ trợ Part 5, không học dàn trải.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMixed/Mock:\u003c/strong\u003e Luyện câu trộn, làm đề tính giờ, phân tích lỗi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eLưu ý:\u003c/strong\u003e Các mức ưu tiên phản ánh chiến lược tối ưu công sức cho người Reading 135, \u003cstrong\u003ekhông phải số liệu thống kê chính thức về tần suất xuất hiện\u003c/strong\u003e của từng dạng. Mục tiêu đúng 20–23/30 Part 5 là một KPI luyện tập, không bảo đảm tổng TOEIC 600; cần học cả Listening và Part 6–7.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr /\u003e\n\u003ch2\u003e1. Mục tiêu, nguyên tắc và KPI\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eChỉ số\u003c/th\u003e\n  \u003cth\u003eHiện tại / Mục tiêu\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eReading hiện tại\u003c/td\u003e\n  \u003ctd\u003e135/495\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eTOEIC tổng mục tiêu\u003c/td\u003e\n  \u003ctd\u003e600+ / 990\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePart 5\u003c/td\u003e\n  \u003ctd\u003ePhấn đấu 20–23/30 câu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eThời gian Part 5\u003c/td\u003e\n  \u003ctd\u003eTiến tới 10–12 phút / 30 câu (sau giai đoạn học nền tảng)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eThời lượng dự kiến\u003c/td\u003e\n  \u003ctd\u003e8 tuần, 60–90 phút/ngày, 6 ngày/tuần\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNguyên tắc học\u003c/td\u003e\n  \u003ctd\u003eCore → bài tập theo core → review lỗi → kiểm tra lại → mixed test → mock test\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e1.1. Thứ tự học\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-mermaid\"\u003eflowchart TD\n    A[TOEIC Part 5] --\u0026gt; B[P0: Sentence Foundation]\n    B --\u0026gt; C[P1: Word Forms]\n    C --\u0026gt; D[P1: Verb System]\n    D --\u0026gt; E[P1: Pronouns \u0026amp; Determiners]\n    E --\u0026gt; F[P1: Connectors \u0026amp; Prepositions]\n    F --\u0026gt; G[P2: Sentence Expansion]\n    G --\u0026gt; H[Mixed Grammar Practice]\n    H --\u0026gt; I[Timed Part 5 / Full Reading]\n    I --\u0026gt; J[Review lỗi và quay về core yếu]\n    J --\u0026gt; H\n    A -.-\u0026gt; K[Vocabulary chọn lọc học song song]\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e1.2. Quy tắc PASS / FAIL\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eTrạng thái của một core:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eNOT_STARTED\u003c/code\u003e — Chưa bắt đầu.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLEARNING\u003c/code\u003e — Đang học lý thuyết, ví dụ và bẫy.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePRACTICING\u003c/code\u003e — Đang làm bài tập theo core.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eREVIEW_DUE\u003c/code\u003e — Đã đạt lần đầu, cần kiểm tra lại sau 3 ngày.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePASSED\u003c/code\u003e — Đạt bài kiểm tra và kiểm tra lại; có thể chuyển core.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNEEDS_REVIEW\u003c/code\u003e — Không đạt hoặc làm sai lại; học lại phần sai.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eNgưỡng đánh giá:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMặc định: \u003cstrong\u003eít nhất 8/10 câu đúng\u003c/strong\u003e trong bài test theo core, sau đó kiểm tra lại sau 3 ngày đạt \u003cstrong\u003eít nhất 8/10\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eCore dễ nhầm \u003ccode\u003eVB-01\u003c/code\u003e, \u003ccode\u003eVB-07\u003c/code\u003e, \u003ccode\u003eVB-09\u003c/code\u003e, \u003ccode\u003ePD-01\u003c/code\u003e, \u003ccode\u003ePD-02\u003c/code\u003e, \u003ccode\u003ePD-03\u003c/code\u003e: yêu cầu \u003cstrong\u003eít nhất 9/10 lần đầu\u003c/strong\u003e; lần ôn lại cũng đạt ít nhất 9/10.\u003c/li\u003e\n\u003cli\u003eBài test lại phải dùng câu khác, không dùng y nguyên câu hỏi cũ.\u003c/li\u003e\n\u003cli\u003eNgười học cần \u003cstrong\u003egiải thích được vì sao chọn đáp án đúng\u003c/strong\u003e và lý do loại đáp án sai. Đoán đúng không đồng nghĩa hiểu core.\u003c/li\u003e\n\u003cli\u003eNếu không đạt, mở lại lý thuyết/bẫy, làm bài luyện mới rồi kiểm tra lại.\u003c/li\u003e\n\u003cli\u003eCác mốc như 8/10, 9/10 là \u003cstrong\u003equy tắc học tập đề xuất\u003c/strong\u003e, không phải tiêu chí chính thức từ ETS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e1.3. Tiêu chí chuyển giai đoạn\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eGiai đoạn\u003c/th\u003e\n  \u003cth\u003eĐiều kiện hoàn thành\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP0\u003c/td\u003e\n  \u003ctd\u003eHoàn thành cả 5 core và đạt ít nhất 9/10 bài nhận diện thành phần câu tổng hợp\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP1-WF\u003c/td\u003e\n  \u003ctd\u003eCác core WF đạt PASS; mixed Word Forms đạt ít nhất 17/20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP1-VB\u003c/td\u003e\n  \u003ctd\u003eCác core VB đạt PASS; mixed Verb System đạt ít nhất 25/30\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP1-PD\u003c/td\u003e\n  \u003ctd\u003eCác core PD đạt PASS; mixed đạt ít nhất 17/20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP1-CP\u003c/td\u003e\n  \u003ctd\u003eCác core CP đạt PASS; mixed lần đầu 16/20, sau 3 ngày 17/20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eP2-SE\u003c/td\u003e\n  \u003ctd\u003eCác core SE trọng tâm đạt PASS; mixed P2 đạt ít nhất 24/30\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMixed readiness\u003c/td\u003e\n  \u003ctd\u003eP0 hoàn thành; ít nhất 90% core P1 đạt PASS, không bỏ WF/VB; P2 trọng tâm đã học; test 30 câu trộn đạt ít nhất 24/30 \u003cem\u003ekhông giới hạn thời gian\u003c/em\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eTimed readiness\u003c/td\u003e\n  \u003ctd\u003eDuy trì đúng khoảng 20–23/30 trong các bộ Part 5 mới, hướng tới 10–12 phút; xác định và khắc phục lỗi sai\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eP2 trọng tâm:\u003c/strong\u003e \u003ccode\u003eSE-01\u003c/code\u003e, \u003ccode\u003eSE-02\u003c/code\u003e, \u003ccode\u003eSE-03\u003c/code\u003e, \u003ccode\u003eSE-04\u003c/code\u003e. \u003ccode\u003eSE-05\u003c/code\u003e và \u003ccode\u003eSE-06\u003c/code\u003e vẫn nên học nhưng có thể hoãn nếu tiến độ chậm. Không cần chờ hoàn thành 100% P2 mới bắt đầu làm câu trộn ở mức nhẹ; tiêu chí trên chỉ áp dụng cho việc \u003cstrong\u003echuyển trọng tâm sang cày đề\u003c/strong\u003e.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e2. Cây kiến thức tổng thể (Knowledge Tree)\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eTOEIC PART 5\n├── P0. SENTENCE FOUNDATION (5 core)\n│   ├── P0.1 Subject (S)\n│   ├── P0.2 Verb (V)\n│   ├── P0.3 Object (O)\n│   ├── P0.4 Noun Phrase\n│   └── P0.5 Clause vs Phrase\n├── P1.1 WORD FORMS (6 core)\n│   ├── WF-01 Noun\n│   ├── WF-02 Verb\n│   ├── WF-03 Adjective\n│   ├── WF-04 Adverb\n│   ├── WF-05 Word Family\n│   └── WF-06 Suffix\n├── P1.2 VERB SYSTEM (10 core)\n│   ├── VB-01 Subject–Verb Agreement\n│   ├── VB-02 Present Simple\n│   ├── VB-03 Past Simple\n│   ├── VB-04 Future Simple\n│   ├── VB-05 Present Continuous\n│   ├── VB-06 Present Perfect\n│   ├── VB-07 Passive Voice\n│   ├── VB-08 Modal Verbs\n│   ├── VB-09 To V / V-ing / Bare Infinitive\n│   └── VB-10 Past Perfect (basic)\n├── P1.3 PRONOUNS \u0026amp; DETERMINERS (6 core)\n│   ├── PD-01 Subject / Object Pronouns\n│   ├── PD-02 Possessive Adjectives / Pronouns\n│   ├── PD-03 Reflexive Pronouns\n│   ├── PD-04 Articles\n│   ├── PD-05 Countable / Uncountable Nouns\n│   └── PD-06 Quantifiers\n├── P1.4 CONNECTORS \u0026amp; PREPOSITIONS (7 core)\n│   ├── CP-01 because / because of\n│   ├── CP-02 although / despite / in spite of\n│   ├── CP-03 while / during\n│   ├── CP-04 if / unless / when\n│   ├── CP-05 in / on / at / by / until\n│   ├── CP-06 for / since / from / to\n│   └── CP-07 Common Preposition Phrases\n├── P2. SENTENCE EXPANSION (6 core)\n│   ├── SE-01 Relative Clauses\n│   ├── SE-02 Comparatives / Superlatives\n│   ├── SE-03 Participles: V-ing / V3; -ed / -ing ADJ\n│   ├── SE-04 Parallel Structure\n│   ├── SE-05 Basic Conditional Sentences\n│   └── SE-06 Basic Noun Clauses\n├── P3. DEFERRED TOPICS (6 chủ đề, chưa bắt buộc)\n│   ├── Inversion nâng cao\n│   ├── Mixed Conditionals\n│   ├── Advanced Subjunctive\n│   ├── Perfect Continuous Tenses\n│   ├── Complex Reduced Clauses\n│   └── Advanced Causatives / Participial Phrases\n├── VOCABULARY (3 nhánh học song song)\n│   ├── V-01 Word Families\n│   ├── V-02 Collocations\n│   └── V-03 Common Business Vocabulary\n└── PRACTICE\n    ├── Single-core drills\n    ├── Mixed-topic quizzes\n    ├── Timed Part 5 (30 câu)\n    ├── Error log + spaced review\n    └── Full Reading (Part 5–7)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr /\u003e\n\u003ch2\u003e3. P0 — Sentence Foundation (BẮT BUỘC)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eMục tiêu:\u003c/strong\u003e Nhìn câu cơ bản và xác định được S, V, O; phân biệt phrase/clause trước khi học mẹo điền từ.\u003c/p\u003e\n\u003ch3\u003eP0.1 — Subject (Chủ ngữ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Subject là người/vật/sự việc được nói đến trong câu. Cấu trúc mẫu: \u003ccode\u003eS + V\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNhận diện:\u003c/strong\u003e Tìm ai/cái gì thực hiện hành động hoặc đang có trạng thái.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe manager works.\u003c/code\u003e → \u003ccode\u003eThe manager\u003c/code\u003e là S.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eThe manager of the stores works.\u003c/code\u003e → S chính là \u003ccode\u003eThe manager\u003c/code\u003e, không phải \u003ccode\u003estores\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e Xác định đúng S trong ít nhất 9/10 câu ngắn và câu có cụm giới từ.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eP0.2 — Verb (Động từ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Động từ diễn tả hành động/trạng thái; phân biệt động từ chính và trợ động từ cơ bản.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eShe reviews reports.\u003c/code\u003e → \u003ccode\u003ereviews\u003c/code\u003e là V chính; \u003ccode\u003eShe is reviewing reports.\u003c/code\u003e → \u003ccode\u003eis reviewing\u003c/code\u003e là cụm động từ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003ea review\u003c/code\u003e là danh từ, \u003ccode\u003eto review\u003c/code\u003e là động từ nguyên mẫu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e Nhận ra động từ chính/cụm động từ trong ít nhất 9/10 câu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eP0.3 — Object (Tân ngữ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Object trả lời cho câu hỏi “làm gì với ai/cái gì” trong mẫu \u003ccode\u003eS + V + O\u003c/code\u003e của động từ có tân ngữ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eShe reviews the report.\u003c/code\u003e → \u003ccode\u003ethe report\u003c/code\u003e là O.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không phải động từ nào cũng cần tân ngữ: \u003ccode\u003eThe meeting started.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e Phân biệt S/V/O ở ít nhất 9/10 câu mẫu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eP0.4 — Noun Phrase (Cụm danh từ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ea/an/the + (ADV) + ADJ + N\u003c/code\u003e là một mẫu phổ biến; xác định được head noun (danh từ chính).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ea very important meeting\u003c/code\u003e → \u003ccode\u003emeeting\u003c/code\u003e là head noun; \u003ccode\u003every\u003c/code\u003e bổ nghĩa \u003ccode\u003eimportant\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không phải mọi danh từ đều cần mạo từ; danh từ số nhiều và danh từ không đếm được có quy tắc riêng.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e Xác định head noun và vai trò ADJ/ADV trong ít nhất 9/10 cụm.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eP0.5 — Clause vs Phrase (Mệnh đề và cụm từ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Clause thường có S + V; phrase không có cặp chủ ngữ + động từ chia thì đầy đủ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ebecause it rained\u003c/code\u003e (clause) vs \u003ccode\u003ebecause of the rain\u003c/code\u003e (prepositional phrase).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Mệnh đề phụ không nhất thiết đứng độc lập thành câu hoàn chỉnh.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e Phân loại đúng ít nhất 9/10 ví dụ phrase/clause.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eP0 Gate:\u003c/strong\u003e Bài tổng hợp 10 câu xác định S/V/O, noun phrase và phrase/clause: ≥9/10.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e4. P1.1 — Word Forms (Từ loại)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eMục tiêu:\u003c/strong\u003e Nhìn vị trí chỗ trống và lựa chọn đúng loại từ: N / V / ADJ / ADV.\u003c/p\u003e\n\u003ch3\u003eWF-01 — Noun (N)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Danh từ làm chủ ngữ/tân ngữ; thường sau \u003ccode\u003ea/an/the\u003c/code\u003e, \u003ccode\u003emy/our/their\u003c/code\u003e, tính từ; \u003ccode\u003eADJ + N\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe manager made a decision.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eequipment\u003c/code\u003e, \u003ccode\u003einformation\u003c/code\u003e thường không đếm được; không suy luận từ \u003ccode\u003ethe + ___\u003c/code\u003e luôn là N (vì có thể \u003ccode\u003ethe + ADJ + N\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu nhận diện vị trí N.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eWF-02 — Verb (V)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Mệnh đề cần động từ chính; \u003ccode\u003eS + V\u003c/code\u003e; sau modal là bare infinitive.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe company will expand its operations.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Danh từ và động từ có thể cùng hình thức như \u003ccode\u003eplan\u003c/code\u003e, \u003ccode\u003ereview\u003c/code\u003e, \u003ccode\u003eincrease\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu phân biệt vị trí V/N.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eWF-03 — Adjective (ADJ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e ADJ thường đứng trước N hoặc sau linking verbs như \u003ccode\u003ebe\u003c/code\u003e, \u003ccode\u003ebecome\u003c/code\u003e, \u003ccode\u003eseem\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ea successful project\u003c/code\u003e; \u003ccode\u003eThe proposal is important.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eis\u003c/code\u003e không mặc định yêu cầu V-ing; \u003ccode\u003eis + ADJ\u003c/code\u003e cũng đúng. Các từ \u003ccode\u003e-ed/-ing\u003c/code\u003e có thể là tính từ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu xác định vị trí ADJ.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eWF-04 — Adverb (ADV)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e ADV bổ nghĩa V/ADJ/ADV hoặc cả câu; nhiều từ kết thúc \u003ccode\u003e-ly\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe team worked efficiently.\u003c/code\u003e; \u003ccode\u003ea highly successful product\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không phải mọi từ \u003ccode\u003e-ly\u003c/code\u003e đều là ADV (\u003ccode\u003efriendly\u003c/code\u003e là ADJ); không phải mọi ADV đều có \u003ccode\u003e-ly\u003c/code\u003e (\u003ccode\u003efast\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu phân biệt ADJ/ADV.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eWF-05 — Word Family (Gia đình từ)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Nhận biết các từ cùng gốc nhưng khác chức năng.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003esuccess (N) / succeed (V) / successful (ADJ) / successfully (ADV)\u003c/code\u003e; \u003ccode\u003econsider / consideration / considerable / considerably\u003c/code\u003e (nhận biết nghĩa thay đổi).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Từ cùng gốc \u003cstrong\u003ekhông\u003c/strong\u003e có nghĩa hoàn toàn giống nhau: \u003ccode\u003econsider\u003c/code\u003e = cân nhắc, \u003ccode\u003econsiderable\u003c/code\u003e = đáng kể.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu chọn đúng loại từ trong family.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eWF-06 — Suffix (Hậu tố)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Nhận diện xu hướng: N \u003ccode\u003e-tion, -ment, -ness, -ity\u003c/code\u003e; ADJ \u003ccode\u003e-ive, -al, -ful, -able\u003c/code\u003e; ADV \u003ccode\u003e-ly\u003c/code\u003e; người/đơn vị \u003ccode\u003e-er, -or\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003edevelopment\u003c/code\u003e (N), \u003ccode\u003eeffective\u003c/code\u003e (ADJ), \u003ccode\u003eeffectively\u003c/code\u003e (ADV).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Suffix chỉ là tín hiệu; có ngoại lệ và có thể trùng dạng.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10 câu nhận diện từ loại từ suffix kết hợp vị trí trong câu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWord Forms Gate:\u003c/strong\u003e 6 core PASS + bài mixed 20 câu đạt ≥17/20.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e5. P1.2 — Verb System (Hệ thống động từ)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eMục tiêu:\u003c/strong\u003e Nắm các thì/verb patterns đủ phổ biến, phân biệt active/passive, chia động từ theo subject.\u003c/p\u003e\n\u003ch3\u003eVB-01 — Subject–Verb Agreement\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Present Simple: S số ít ngôi 3 → V-s/es; S số nhiều → V nguyên mẫu. \u003ccode\u003eeach/every + N số ít\u003c/code\u003e thường đi với V số ít.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eEach employee works.\u003c/code\u003e / \u003ccode\u003eThe employees work.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Cụm chen giữa không đổi chủ ngữ: \u003ccode\u003eThe manager of the stores is here.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10 câu lần đầu và ôn lại.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-02 — Present Simple\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + V(s/es)\u003c/code\u003e; thói quen, lịch, sự thật.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGợi ý:\u003c/strong\u003e \u003ccode\u003eusually, often, every day\u003c/code\u003e (không phải dấu hiệu tuyệt đối).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe store opens at 9 A.M.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Chủ ngữ số ít/số nhiều và câu phủ định với \u003ccode\u003edoes not + V\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-03 — Past Simple\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + V2/ed\u003c/code\u003e; hành động đã kết thúc trong quá khứ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGợi ý:\u003c/strong\u003e \u003ccode\u003eyesterday, last week, in 2020\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe company opened a new office last year.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Bất quy tắc (\u003ccode\u003esend → sent\u003c/code\u003e, \u003ccode\u003emake → made\u003c/code\u003e); câu hỏi/phủ định \u003ccode\u003edid + V\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-04 — Future Simple\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + will + V\u003c/code\u003e; dự định/quyết định/dự đoán về tương lai (tùy ngữ cảnh).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGợi ý:\u003c/strong\u003e \u003ccode\u003etomorrow, next month\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe director will attend the meeting.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Sau \u003ccode\u003ewill\u003c/code\u003e dùng V nguyên mẫu; trong mệnh đề thời gian/điều kiện tương lai thường dùng hiện tại đơn: \u003ccode\u003eWhen she arrives, we will start.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-05 — Present Continuous\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + am/is/are + V-ing\u003c/code\u003e; sự việc đang diễn ra hoặc tình huống tạm thời.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe manager is reviewing the budget.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003ebe + ADJ\u003c/code\u003e, \u003ccode\u003ebe + V3\u003c/code\u003e cũng đúng nhưng khác chức năng.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10, nhận diện được chủ động.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-06 — Present Perfect\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + have/has + V3\u003c/code\u003e; trải nghiệm/kết quả còn liên quan hiện tại hoặc hành động kéo dài đến hiện tại.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGợi ý:\u003c/strong\u003e \u003ccode\u003esince, for, already, recently\u003c/code\u003e (phải đọc ngữ cảnh).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe team has completed the report.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003ehave/has\u003c/code\u003e có thể là động từ chính: \u003ccode\u003eShe has a laptop.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-07 — Passive Voice\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + be + V3\u003c/code\u003e; S là đối tượng nhận hành động. Mở rộng: \u003ccode\u003ewas/were + V3\u003c/code\u003e, \u003ccode\u003ewill be + V3\u003c/code\u003e, \u003ccode\u003ehas/have been + V3\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe contract was signed yesterday.\u003c/code\u003e / \u003ccode\u003eThe report is reviewed by the manager.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Đừng coi mọi \u003ccode\u003ebe + V3\u003c/code\u003e đều chỉ sự kiện bị động đang diễn ra; có trường hợp mang tính trạng thái. Phân biệt với \u003ccode\u003ebe + V-ing\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10 câu phân biệt active/passive, lần đầu và ôn lại.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-08 — Modal Verbs\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ecan/could/may/might/must/should/will/would + V nguyên mẫu\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eEmployees must submit the form.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không viết \u003ccode\u003emust submits\u003c/code\u003e; dạng bị động có thể là \u003ccode\u003emust be submitted\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-09 — To V / V-ing / Bare Infinitive\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Nhớ một số patterns: \u003ccode\u003edecide/plan/agree + to V\u003c/code\u003e; \u003ccode\u003eavoid/enjoy/finish + V-ing\u003c/code\u003e; \u003ccode\u003elet/make + O + V\u003c/code\u003e; \u003ccode\u003elook forward to + V-ing\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eWe plan to expand.\u003c/code\u003e / \u003ccode\u003eThey avoided making mistakes.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eto\u003c/code\u003e có thể là giới từ, như \u003ccode\u003elook forward to meeting you\u003c/code\u003e, chứ không luôn là dấu hiệu \u003ccode\u003eto V\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10 câu lần đầu và ôn lại.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eVB-10 — Past Perfect (Basic)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eS + had + V3\u003c/code\u003e, sự việc hoàn thành trước một mốc/sự việc quá khứ khác.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe meeting had ended before I arrived.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không dùng past perfect chỉ vì có hai sự việc quá khứ; cần hiểu quan hệ thời gian.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eVerb System Gate:\u003c/strong\u003e 10 core PASS + mixed 30 câu đạt ≥25/30.\u003c/p\u003e\n\u003ch3\u003eSo sánh bắt buộc: \u003ccode\u003eis + ...\u003c/code\u003e\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eCấu trúc\u003c/th\u003e\n  \u003cth\u003eChức năng thường gặp\u003c/th\u003e\n  \u003cth\u003eVí dụ\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eis + V-ing\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eHiện tại tiếp diễn (chủ động)\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eThe manager is reviewing the report.\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eis + V3/ed\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eBị động hoặc trạng thái\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eThe report is reviewed by the manager.\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eis + ADJ\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eMô tả tính chất/trạng thái\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eThe report is important.\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003eKhông suy luận chỉ bằng một từ \u003ccode\u003eis\u003c/code\u003e: phải đọc cả chủ ngữ và phần sau chỗ trống.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr /\u003e\n\u003ch2\u003e6. P1.3 — Pronouns \u0026amp; Determiners\u003c/h2\u003e\n\u003ch3\u003ePD-01 — Subject / Object Pronouns\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Chủ ngữ: \u003ccode\u003eI, you, he, she, it, we, they\u003c/code\u003e. Tân ngữ: \u003ccode\u003eme, you, him, her, it, us, them\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eShe called him.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Sau giới từ thường dùng object pronoun: \u003ccode\u003efor them\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePD-02 — Possessive Adjectives / Pronouns\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003emy/your/his/her/its/our/their + N\u003c/code\u003e; đại từ sở hữu \u003ccode\u003emine/yours/his/hers/ours/theirs\u003c/code\u003e đứng độc lập.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003etheir reports\u003c/code\u003e / \u003ccode\u003eThe reports are theirs.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eits\u003c/code\u003e (sở hữu) khác \u003ccode\u003eit's\u003c/code\u003e (= it is/it has).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePD-03 — Reflexive Pronouns\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003emyself, yourself, himself, herself, itself, ourselves, yourselves, themselves\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eShe prepared the presentation herself.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không dùng reflexive pronoun thay cho subject/object pronoun bình thường.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS đặc biệt:\u003c/strong\u003e ≥9/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePD-04 — Articles\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ea/an\u003c/code\u003e với danh từ đếm được số ít chưa xác định; \u003ccode\u003ethe\u003c/code\u003e khi xác định; biết trường hợp danh từ không cần article.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ean agreement\u003c/code\u003e / \u003ccode\u003ethe agreement we signed\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003ea/an\u003c/code\u003e dựa vào \u003cstrong\u003eâm đầu\u003c/strong\u003e (\u003ccode\u003ean hour\u003c/code\u003e, \u003ccode\u003ea university\u003c/code\u003e), không chỉ chữ cái.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePD-05 — Countable / Uncountable Nouns\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e N số ít/số nhiều; danh từ không đếm được phổ biến: \u003ccode\u003einformation\u003c/code\u003e, \u003ccode\u003eequipment\u003c/code\u003e, \u003ccode\u003eadvice\u003c/code\u003e, \u003ccode\u003efurniture\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003esome equipment\u003c/code\u003e, không dùng \u003ccode\u003ean equipment\u003c/code\u003e theo nghĩa thông thường.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003einformation\u003c/code\u003e không thêm \u003ccode\u003e-s\u003c/code\u003e khi dùng theo nghĩa thông thường.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePD-06 — Quantifiers\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003emany/few/a few + N đếm được số nhiều\u003c/code\u003e; \u003ccode\u003emuch/little/a little + N không đếm được\u003c/code\u003e; \u003ccode\u003esome/any/all/each/every\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003emany employees\u003c/code\u003e; \u003ccode\u003emuch information\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Phân biệt \u003ccode\u003efew\u003c/code\u003e (ít, gần như không đủ) và \u003ccode\u003ea few\u003c/code\u003e (một vài); \u003ccode\u003eeach/every + N số ít\u003c/code\u003e trong mẫu thông dụng.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePronouns \u0026amp; Determiners Gate:\u003c/strong\u003e 6 core PASS + mixed 20 câu đạt ≥17/20.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e7. P1.4 — Connectors \u0026amp; Prepositions\u003c/h2\u003e\n\u003ch3\u003eCP-01 — because / because of\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ebecause + clause\u003c/code\u003e; \u003ccode\u003ebecause of + noun phrase / V-ing phrase\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ebecause it rained\u003c/code\u003e / \u003ccode\u003ebecause of the rain\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không viết \u003ccode\u003ebecause of it rained\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-02 — although / despite / in spite of\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ealthough + clause\u003c/code\u003e; \u003ccode\u003edespite / in spite of + N / V-ing\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eAlthough it rained, we went out.\u003c/code\u003e / \u003ccode\u003eDespite the rain, we went out.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003edespite of\u003c/code\u003e là sai; đúng là \u003ccode\u003edespite\u003c/code\u003e hoặc \u003ccode\u003ein spite of\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-03 — while / during\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ewhile + clause\u003c/code\u003e; \u003ccode\u003eduring + noun phrase\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ewhile we were meeting\u003c/code\u003e / \u003ccode\u003eduring the meeting\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không dùng \u003ccode\u003eduring we met\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-04 — if / unless / when\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003eif = nếu\u003c/code\u003e; \u003ccode\u003eunless = trừ khi/nếu không\u003c/code\u003e; \u003ccode\u003ewhen = khi\u003c/code\u003e. Trong điều kiện thực ở tương lai: \u003ccode\u003eIf + present, will + V\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eIf it rains, we will postpone the tour.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eunless\u003c/code\u003e không phải cách thay thế máy móc cho \u003ccode\u003eif\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-05 — in / on / at / by / until\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Thời gian: \u003ccode\u003ein October\u003c/code\u003e, \u003ccode\u003eon Monday\u003c/code\u003e, \u003ccode\u003eat 9 A.M.\u003c/code\u003e; \u003ccode\u003eby Friday\u003c/code\u003e = chậm nhất thứ Sáu; \u003ccode\u003euntil Friday\u003c/code\u003e = kéo dài đến thứ Sáu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eSubmit the report by Friday.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eby\u003c/code\u003e khác \u003ccode\u003euntil\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-06 — for / since / from / to\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003efor + khoảng thời gian\u003c/code\u003e; \u003ccode\u003esince + mốc\u003c/code\u003e; \u003ccode\u003efrom ... to ...\u003c/code\u003e chỉ khoảng/điểm đầu-cuối.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003efor two years\u003c/code\u003e; \u003ccode\u003esince 2024\u003c/code\u003e; \u003ccode\u003efrom Monday to Friday\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003efor\u003c/code\u003e không đồng nghĩa \u003ccode\u003esince\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eCP-07 — Common Preposition Phrases\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Học cụm: \u003ccode\u003eresponsible for\u003c/code\u003e, \u003ccode\u003einterested in\u003c/code\u003e, \u003ccode\u003eaccording to\u003c/code\u003e, \u003ccode\u003eparticipate in\u003c/code\u003e, \u003ccode\u003edepend on\u003c/code\u003e, \u003ccode\u003eapply for\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eShe is responsible for scheduling meetings.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Không dịch giới từ từng chữ; học cả collocation.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eConnectors \u0026amp; Prepositions Gate:\u003c/strong\u003e 7 core PASS + mixed ≥16/20; sau 3 ngày ≥17/20.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e8. P2 — Sentence Expansion\u003c/h2\u003e\n\u003ch3\u003eSE-01 — Relative Clauses\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ewho\u003c/code\u003e (người), \u003ccode\u003ewhich\u003c/code\u003e (vật/sự việc), \u003ccode\u003ethat\u003c/code\u003e (người/vật trong mệnh đề xác định), \u003ccode\u003ewhose\u003c/code\u003e (sở hữu), \u003ccode\u003ewhere\u003c/code\u003e (địa điểm).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThe employee who joined yesterday is here.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003ewhere\u003c/code\u003e không thay thế mọi \u003ccode\u003ewhich\u003c/code\u003e; phân biệt vị trí đại từ quan hệ trong câu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eSE-02 — Comparatives / Superlatives\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003e-er / more + ADJ\u003c/code\u003e, \u003ccode\u003e-est / most + ADJ\u003c/code\u003e, \u003ccode\u003eas ... as\u003c/code\u003e, \u003ccode\u003ethan\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eThis process is more efficient than the old one.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003emore better\u003c/code\u003e là sai; phân biệt ADJ/ADV trong so sánh.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eSE-03 — Participles: V-ing / V3; -ed / -ing Adjectives\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e V-ing thường mang nghĩa chủ động hoặc gây ra cảm giác; V3 thường mang nghĩa bị động/đã được tác động; -ed ADJ thường mô tả cảm giác người/vật trải nghiệm.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ea revised document\u003c/code\u003e; \u003ccode\u003ean interesting presentation\u003c/code\u003e; \u003ccode\u003einterested employees\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Đừng áp dụng cứng nhắc công thức V-ing = chủ động, V3 = bị động cho mọi adjective; kiểm tra nghĩa thực tế.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eSE-04 — Parallel Structure\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Hai hoặc nhiều thành phần nối bởi \u003ccode\u003eand/or\u003c/code\u003e nên tương đồng về cấu trúc.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eplanning, organizing, and reviewing projects\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e \u003ccode\u003eto plan and organizing\u003c/code\u003e thường sai khi cùng vai trò song song.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eSE-05 — Basic Conditionals\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e Type 1: \u003ccode\u003eIf + present, will + V\u003c/code\u003e; type 2: \u003ccode\u003eIf + past, would + V\u003c/code\u003e; làm quen zero conditional.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eIf the supplier arrives late, we will reschedule.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Type 2 diễn tả giả định, không nhất thiết sự kiện quá khứ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eSE-06 — Basic Noun Clauses\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore:\u003c/strong\u003e \u003ccode\u003ethat / whether / if / what\u003c/code\u003e trong mệnh đề đóng vai trò danh từ.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003ePlease confirm whether the shipment has arrived.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBẫy:\u003c/strong\u003e Trật tự câu kể trong mệnh đề hỏi gián tiếp: \u003ccode\u003ewhere the office is\u003c/code\u003e (không phải \u003ccode\u003ewhere is the office\u003c/code\u003e trong cấu trúc này).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePASS:\u003c/strong\u003e ≥8/10.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eP2 Gate:\u003c/strong\u003e 6 core PASS + mixed 30 câu ≥24/30; nếu thiếu thời gian, ưu tiên SE-01–04.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e9. P3 — Deferred Topics (Tạm hoãn)\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eChủ đề\u003c/th\u003e\n  \u003cth\u003eQuyết định\u003c/th\u003e\n  \u003cth\u003eKhi nào học?\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eInversion nâng cao\u003c/td\u003e\n  \u003ctd\u003eHoãn\u003c/td\u003e\n  \u003ctd\u003eKhi đã ổn định Part 5 mục tiêu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMixed Conditionals\u003c/td\u003e\n  \u003ctd\u003eHoãn\u003c/td\u003e\n  \u003ctd\u003eKhi cần nâng mức chính xác ở câu khó\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAdvanced Subjunctive\u003c/td\u003e\n  \u003ctd\u003eHoãn; biết qua mẫu \u003ccode\u003erecommend that + S + V\u003c/code\u003e khi gặp đề\u003c/td\u003e\n  \u003ctd\u003eSau P1/P2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePerfect Continuous Tenses\u003c/td\u003e\n  \u003ctd\u003eHoãn\u003c/td\u003e\n  \u003ctd\u003eSau khi nắm vững thì thường gặp\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eReduced Clauses phức tạp\u003c/td\u003e\n  \u003ctd\u003eHoãn\u003c/td\u003e\n  \u003ctd\u003eKhi đọc được câu dài và phân tích mệnh đề tốt\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAdvanced Causatives / Participial Phrases\u003c/td\u003e\n  \u003ctd\u003eHoãn\u003c/td\u003e\n  \u003ctd\u003eNếu ngân hàng lỗi sai chỉ ra đây là điểm yếu thực sự\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eNguyên tắc:\u003c/strong\u003e Không dành nhiều thời gian cho P3 nếu những câu cơ bản thuộc P1 vẫn sai thường xuyên.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e10. Vocabulary — Học chọn lọc, song song Grammar\u003c/h2\u003e\n\u003ch3\u003eV-01 — Word Families\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMục tiêu:\u003c/strong\u003e Nhận biết N/V/ADJ/ADV của từ hay gặp để giải Part 5.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003eapply / application / applicant\u003c/code\u003e; \u003ccode\u003eproduce / product / production / productive\u003c/code\u003e; \u003ccode\u003esucceed / success / successful / successfully\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCách học:\u003c/strong\u003e Gắn mỗi family với một câu có ngữ cảnh; không chỉ chép bốn dạng từ.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eV-02 — Collocations\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMục tiêu:\u003c/strong\u003e Học các cụm thường xuất hiện trong văn phòng, công ty.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e \u003ccode\u003esign a contract\u003c/code\u003e, \u003ccode\u003erenew a contract\u003c/code\u003e, \u003ccode\u003emeet a deadline\u003c/code\u003e, \u003ccode\u003esubmit a report\u003c/code\u003e, \u003ccode\u003eattend a meeting\u003c/code\u003e, \u003ccode\u003elaunch a product\u003c/code\u003e, \u003ccode\u003eincrease capacity\u003c/code\u003e, \u003ccode\u003ereview an application\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCách học:\u003c/strong\u003e Ghi cả cụm và nghĩa, không học riêng từng từ.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eV-03 — Common Business Vocabulary\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eChủ đề\u003c/th\u003e\n  \u003cth\u003eTừ/cụm minh họa\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eOffice\u003c/td\u003e\n  \u003ctd\u003eschedule, appointment, document, department, colleague\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRecruitment\u003c/td\u003e\n  \u003ctd\u003eapplicant, application, position, hire, interview\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFinance\u003c/td\u003e\n  \u003ctd\u003ebudget, expense, invoice, payment, revenue\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eManufacturing\u003c/td\u003e\n  \u003ctd\u003efactory, plant, facility, equipment, capacity\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLogistics\u003c/td\u003e\n  \u003ctd\u003eshipment, delivery, supplier, order, warehouse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eEvents/Marketing\u003c/td\u003e\n  \u003ctd\u003econference, trade show, catalog, press release, newsletter\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eContracts\u003c/td\u003e\n  \u003ctd\u003econtract, agreement, renewal, term, deadline\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eVocabulary policy:\u003c/strong\u003e Mỗi ngày 5–8 từ/cụm xuất hiện trong chính bài đã học; ôn sau 1–3–7 ngày. Không đặt mục tiêu bắt buộc học hàng nghìn từ trước khi giải đề.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e11. Lộ trình 8 tuần\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTuần\u003c/th\u003e\n  \u003cth\u003eNội dung chính\u003c/th\u003e\n  \u003cth\u003eĐầu ra / Gate\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n  \u003ctd\u003eP0 +
