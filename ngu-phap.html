WF-01–06\u003c/td\u003e\n  \u003ctd\u003eP0 ≥9/10; WF mixed ≥17/20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003eVB-01–06\u003c/td\u003e\n  \u003ctd\u003eNhận diện đúng S–V, các thì cơ bản\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003eVB-07–10 + ôn VB-01–06\u003c/td\u003e\n  \u003ctd\u003eVB mixed ≥25/30\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e4\u003c/td\u003e\n  \u003ctd\u003ePD-01–06 + CP-01–07\u003c/td\u003e\n  \u003ctd\u003ePD mixed ≥17/20; CP mixed ≥16/20\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e5\u003c/td\u003e\n  \u003ctd\u003eSE-01–06 + ôn P1\u003c/td\u003e\n  \u003ctd\u003eSE mixed ≥24/30 (ưu tiên SE-01–04 nếu chậm)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e6\u003c/td\u003e\n  \u003ctd\u003e3–4 bộ mixed Part 5 (30 câu)\u003c/td\u003e\n  \u003ctd\u003eTiến tới 18–20/30; error log đầy đủ\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e7\u003c/td\u003e\n  \u003ctd\u003e4–5 bộ Part 5 tính giờ\u003c/td\u003e\n  \u003ctd\u003eTiến tới 20–22/30; 12–15 phút\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e8\u003c/td\u003e\n  \u003ctd\u003ePart 5 tính giờ + ít nhất 1 full Reading Part 5–7\u003c/td\u003e\n  \u003ctd\u003ePhấn đấu 20–23/30; 10–12 phút; xác định nhánh yếu\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eKhông chạy theo tuần bằng mọi giá.\u003c/strong\u003e Nếu chưa qua Gate, kéo dài giai đoạn tương ứng. Mốc tuần là ước lượng, không phải cam kết thời gian đạt điểm.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e11.1. Một buổi học mẫu 75 phút\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eThời gian\u003c/th\u003e\n  \u003cth\u003eHoạt động\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e15 phút\u003c/td\u003e\n  \u003ctd\u003eÔn core cũ, lỗi sai và flashcards đến hạn\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e20 phút\u003c/td\u003e\n  \u003ctd\u003eHọc 1 core mới, công thức và bẫy\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e30 phút\u003c/td\u003e\n  \u003ctd\u003eLàm 15–20 câu luyện, xem giải thích và ghi lỗi\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e10 phút\u003c/td\u003e\n  \u003ctd\u003eÔn 5–8 từ vựng/collocation phát sinh\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch3\u003e11.2. Kỹ thuật luyện\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSingle-core drills:\u003c/strong\u003e Câu hỏi chỉ thuộc một core; dùng để hiểu quy tắc.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMixed-topic practice:\u003c/strong\u003e Trộn core, không báo trước chủ đề; dùng để luyện nhận diện.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTimed Part 5:\u003c/strong\u003e 30 câu, tập rút thời gian từ 15 xuống 10–12 phút khi độ chính xác đã ổn định.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eError review:\u003c/strong\u003e Mỗi câu sai phải gắn core ID và nguyên nhân.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSpaced review:\u003c/strong\u003e Ôn lại sau 1 ngày, 3 ngày, 7 ngày cho lỗi và từ vựng.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr /\u003e\n\u003ch2\u003e12. Diagnostic Mini Test (6 câu mẫu)\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eDùng để định hướng ban đầu, \u003cstrong\u003ekhông đủ\u003c/strong\u003e để ước lượng điểm TOEIC. Khi đưa lên website, không hiển thị đáp án trước khi người học nộp bài.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eQ1 — VB-05\u003c/strong\u003e\u003cbr /\u003e\nThe manager is ______ the budget.\u003cbr /\u003e\nA. review · B. reviewed · C. reviewing · D. reviews\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ2 — WF-03\u003c/strong\u003e\u003cbr /\u003e\nThe company hired a ______ designer.\u003cbr /\u003e\nA. profession · B. professional · C. professionally · D. professionalism\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ3 — PD-02\u003c/strong\u003e\u003cbr /\u003e\nAll employees must bring ______ identification cards.\u003cbr /\u003e\nA. they · B. them · C. their · D. theirs\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ4 — CP-01\u003c/strong\u003e\u003cbr /\u003e\nThe event was canceled ______ the bad weather.\u003cbr /\u003e\nA. because · B. because of · C. although · D. while\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ5 — VB-07\u003c/strong\u003e\u003cbr /\u003e\nThe documents ______ yesterday.\u003cbr /\u003e\nA. send · B. sent · C. were sent · D. sending\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQ6 — WF-04\u003c/strong\u003e\u003cbr /\u003e\nThe new software works more ______ than the previous version.\u003cbr /\u003e\nA. efficient · B. efficiency · C. efficiently · D. efficiencies\u003c/p\u003e\n\u003cp\u003e\u0026lt;details\u0026gt;\n\u0026lt;summary\u0026gt;Đáp án và giải thích — chỉ mở sau khi làm bài\u0026lt;/summary\u0026gt;\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eCâu\u003c/th\u003e\n  \u003cth\u003eĐáp án\u003c/th\u003e\n  \u003cth\u003eCore\u003c/th\u003e\n  \u003cth\u003eGiải thích\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ1\u003c/td\u003e\n  \u003ctd\u003eC\u003c/td\u003e\n  \u003ctd\u003eVB-05\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eis + V-ing\u003c/code\u003e diễn tả hành động đang diễn ra, manager trực tiếp review budget.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ2\u003c/td\u003e\n  \u003ctd\u003eB\u003c/td\u003e\n  \u003ctd\u003eWF-03\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eprofessional\u003c/code\u003e là ADJ bổ nghĩa cho \u003ccode\u003edesigner\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ3\u003c/td\u003e\n  \u003ctd\u003eC\u003c/td\u003e\n  \u003ctd\u003ePD-02\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003etheir + noun phrase\u003c/code\u003e là tính từ sở hữu.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ4\u003c/td\u003e\n  \u003ctd\u003eB\u003c/td\u003e\n  \u003ctd\u003eCP-01\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ebecause of + noun phrase\u003c/code\u003e (\u003ccode\u003ethe bad weather\u003c/code\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ5\u003c/td\u003e\n  \u003ctd\u003eC\u003c/td\u003e\n  \u003ctd\u003eVB-07\u003c/td\u003e\n  \u003ctd\u003eBị động quá khứ: \u003ccode\u003ewere + V3\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eQ6\u003c/td\u003e\n  \u003ctd\u003eC\u003c/td\u003e\n  \u003ctd\u003eWF-04\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eefficiently\u003c/code\u003e là ADV bổ nghĩa cho \u003ccode\u003eworks\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026lt;/details\u0026gt;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐề xuất điều hướng sau diagnostic:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e0–2/6: học từ P0, đi đầy đủ thứ tự.\u003c/li\u003e\n\u003cli\u003e3–4/6: học P0 nhanh, ưu tiên các core trả lời sai.\u003c/li\u003e\n\u003cli\u003e5–6/6: làm bài đầu vào dài hơn cho từng core; không tự động bỏ qua P0/P1 chỉ nhờ 6 câu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr /\u003e\n\u003ch2\u003e13. Error Log — Nhật ký lỗi sai\u003c/h2\u003e\n\u003cp\u003eMỗi câu trả lời cần lưu ít nhất:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTrường\u003c/th\u003e\n  \u003cth\u003eÝ nghĩa\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003equestion_id\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eID câu hỏi cố định\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ecore_id\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eCore chính của câu, ví dụ \u003ccode\u003eVB-07\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eselected_answer\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eĐáp án người học chọn\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ecorrect_answer\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eĐáp án đúng\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eis_correct\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eĐúng/sai\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eerror_type\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eGRAMMAR_UNKNOWN\u003c/code\u003e, \u003ccode\u003ePATTERN_CONFUSION\u003c/code\u003e, \u003ccode\u003eVOCAB_UNKNOWN\u003c/code\u003e, \u003ccode\u003eTIME_PRESSURE\u003c/code\u003e, \u003ccode\u003eCARELESS\u003c/code\u003e, \u003ccode\u003eGUESSED\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eexplanation\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eTại sao đúng, tại sao đáp án sai\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ereview_due_at\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eNgày ôn tiếp theo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eattempted_at\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eThời điểm trả lời\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eCâu\u003c/th\u003e\n  \u003cth\u003eCore\u003c/th\u003e\n  \u003cth\u003eNguyên nhân\u003c/th\u003e\n  \u003cth\u003eHành động\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e115\u003c/td\u003e\n  \u003ctd\u003eVB-05/VB-07\u003c/td\u003e\n  \u003ctd\u003eNhầm \u003ccode\u003eis + V-ing\u003c/code\u003e / \u003ccode\u003eis + V3\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eÔn active/passive\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e116\u003c/td\u003e\n  \u003ctd\u003eWF-03\u003c/td\u003e\n  \u003ctd\u003eKhông nhận ra vị trí ADJ\u003c/td\u003e\n  \u003ctd\u003eLàm 10 câu ADJ + N\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e117\u003c/td\u003e\n  \u003ctd\u003eCP-01\u003c/td\u003e\n  \u003ctd\u003eNhầm \u003ccode\u003ebecause\u003c/code\u003e / \u003ccode\u003ebecause of\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eÔn clause/phrase\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Lỗi lặp lại từ 2 lần trở lên tại một core → ưu tiên ôn core đó trong buổi học kế tiếp.\u003c/p\u003e\n\u003chr /\u003e\n\u003ch2\u003e14. Kế hoạch biến roadmap thành website\u003c/h2\u003e\n\u003ch3\u003e14.1. ChatGPT có thể làm gì?\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eCó thể:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChuyển cây kiến thức thành UI dạng sidebar/tree và trang học từng core.\u003c/li\u003e\n\u003cli\u003eTạo bài học theo core với phần \u003cstrong\u003equy tắc → ví dụ → bẫy → luyện tập → kiểm tra\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eXây câu hỏi trắc nghiệm 4 đáp án, tính điểm, giải thích và hiển thị các core yếu.\u003c/li\u003e\n\u003cli\u003eLưu tiến độ học, trạng thái \u003ccode\u003eNOT_STARTED/LEARNING/PRACTICING/REVIEW_DUE/PASSED/NEEDS_REVIEW\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eThiết kế bài kiểm tra mixed và Part 5 tính giờ, hỗ trợ ôn lặp lại theo lịch.\u003c/li\u003e\n\u003cli\u003eTạo code dự án React/Next.js, chạy local và hướng dẫn triển khai website.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eGiới hạn cần biết:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFile Markdown \u003cstrong\u003elà roadmap/đặc tả\u003c/strong\u003e, chưa tự biến thành website tương tác chỉ bằng việc đổi đuôi file.\u003c/li\u003e\n\u003cli\u003eWebsite tương tác cần frontend, định dạng câu hỏi có cấu trúc, state/persistence; nếu muốn đăng nhập và đồng bộ nhiều thiết bị cần backend/database.\u003c/li\u003e\n\u003cli\u003eCần biên soạn, rà soát và kiểm định ngân hàng câu hỏi riêng; không coi ví dụ đơn lẻ trong roadmap là đủ để thi mỗi core.\u003c/li\u003e\n\u003cli\u003eĐiểm mini test là thước đo luyện tập, không được diễn giải như điểm TOEIC chính thức.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e14.2. MVP khuyến nghị\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eGiai đoạn 1 — Local-first (không cần account):\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDashboard:\u003c/strong\u003e KPI, tiến độ tổng, core đang học, lịch review.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKnowledge Tree:\u003c/strong\u003e P0/P1/P2/P3, filter theo trạng thái/độ ưu tiên.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCore Detail:\u003c/strong\u003e Mục tiêu, prerequisites, lý thuyết, ví dụ, bẫy, nút bắt đầu quiz.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCore Quiz:\u003c/strong\u003e 10 câu, chấm điểm, giải thích từng câu, yêu cầu PASS.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eError Log:\u003c/strong\u003e Danh sách lỗi, lọc theo \u003ccode\u003ecore_id\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReview Queue:\u003c/strong\u003e Các core/câu đến hạn 1–3–7 ngày.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMixed Part 5:\u003c/strong\u003e 30 câu trộn, có đồng hồ đếm.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProgress Persistence:\u003c/strong\u003e Lưu tại trình duyệt bằng \u003ccode\u003elocalStorage\u003c/code\u003e hoặc \u003ccode\u003eIndexedDB\u003c/code\u003e, có nút export/import JSON.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eGiai đoạn 2 — Khi MVP ổn định:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eĐăng nhập; đồng bộ trên nhiều thiết bị qua database như Supabase/PostgreSQL.\u003c/li\u003e\n\u003cli\u003eDashboard chi tiết theo Accuracy/Time/Error Type.\u003c/li\u003e\n\u003cli\u003eTạo thêm bộ câu hỏi/biến thể có giải thích, tránh học thuộc đáp án.\u003c/li\u003e\n\u003cli\u003eDashboard theo tuần và đề xuất core tiếp theo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e14.3. Cấu trúc kỹ thuật đề xuất\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003esrc/\n├── app/                        # Routes (Next.js App Router) hoặc pages (React Router)\n│   ├── dashboard/\n│   ├── roadmap/\n│   ├── core/[coreId]/\n│   ├── quiz/[coreId]/\n│   ├── review/\n│   └── mock-test/\n├── components/\n│   ├── KnowledgeTree\n│   ├── CoreLesson\n│   ├── QuizPlayer\n│   ├── ProgressBar\n│   └── ErrorLog\n├── content/\n│   ├── roadmap.md             # File markdown này\n│   ├── cores/                 # Một file lesson/core (sau này)\n│   └── questions/             # Question bank theo core (sau này)\n├── lib/\n│   ├── scoring\n│   ├── scheduling\n│   └── storage\n└── types/\n    ├── core\n    ├── question\n    └── progress\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e14.4. Data model khởi tạo\u003c/h3\u003e\n\u003cp\u003eVí dụ JSON cho \u003cstrong\u003ecore\u003c/strong\u003e (chỉ là cấu trúc tham chiếu; khi triển khai cần chuẩn hóa toàn bộ nội dung):\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \u0026quot;id\u0026quot;: \u0026quot;WF-03\u0026quot;,\n  \u0026quot;group\u0026quot;: \u0026quot;P1-WF\u0026quot;,\n  \u0026quot;priority\u0026quot;: \u0026quot;P1\u0026quot;,\n  \u0026quot;title\u0026quot;: \u0026quot;Adjective\u0026quot;,\n  \u0026quot;titleVi\u0026quot;: \u0026quot;Tính từ\u0026quot;,\n  \u0026quot;prerequisites\u0026quot;: [\u0026quot;P0.4\u0026quot;, \u0026quot;WF-01\u0026quot;],\n  \u0026quot;passThreshold\u0026quot;: 8,\n  \u0026quot;quizSize\u0026quot;: 10,\n  \u0026quot;reviewAfterDays\u0026quot;: 3,\n  \u0026quot;lessonPath\u0026quot;: \u0026quot;content/cores/WF-03.md\u0026quot;\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVí dụ JSON cho \u003cstrong\u003equestion\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \u0026quot;id\u0026quot;: \u0026quot;WF-03-Q001\u0026quot;,\n  \u0026quot;coreId\u0026quot;: \u0026quot;WF-03\u0026quot;,\n  \u0026quot;type\u0026quot;: \u0026quot;multiple_choice\u0026quot;,\n  \u0026quot;stem\u0026quot;: \u0026quot;The company hired a ______ designer.\u0026quot;,\n  \u0026quot;options\u0026quot;: [\u0026quot;profession\u0026quot;, \u0026quot;professional\u0026quot;, \u0026quot;professionally\u0026quot;, \u0026quot;professionalism\u0026quot;],\n  \u0026quot;correctOptionIndex\u0026quot;: 1,\n  \u0026quot;explanation\u0026quot;: \u0026quot;Chỗ trống đứng trước designer (N), cần adjective: professional.\u0026quot;,\n  \u0026quot;difficulty\u0026quot;: \u0026quot;basic\u0026quot;,\n  \u0026quot;tags\u0026quot;: [\u0026quot;adj-before-noun\u0026quot;, \u0026quot;word-form\u0026quot;]\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVí dụ JSON cho \u003cstrong\u003eprogress\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \u0026quot;coreId\u0026quot;: \u0026quot;WF-03\u0026quot;,\n  \u0026quot;status\u0026quot;: \u0026quot;REVIEW_DUE\u0026quot;,\n  \u0026quot;firstPassScore\u0026quot;: 9,\n  \u0026quot;latestScore\u0026quot;: 9,\n  \u0026quot;attemptCount\u0026quot;: 2,\n  \u0026quot;nextReviewDate\u0026quot;: \u0026quot;2026-10-11\u0026quot;,\n  \u0026quot;lastStudiedAt\u0026quot;: \u0026quot;2026-10-08T20:00:00+07:00\u0026quot;\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003eNhững JSON trên minh họa cách tổ chức dữ liệu; \u003cstrong\u003ekhông phải dữ liệu tiến độ thực tế\u003c/strong\u003e của người học.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3\u003e14.5. Acceptance Criteria cho MVP website\u003c/h3\u003e\n\u003cul\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eRoadmap thể hiện đủ core và đúng thứ tự, giữ nguyên ID như tài liệu.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eNgười dùng có thể mở core và đọc quy tắc/ví dụ/bẫy.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eMỗi core có ngân hàng câu hỏi mới, đúng chủ đề; quiz có 10 câu và giải thích.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eSau bài kiểm tra, website hiển thị điểm và ngưỡng PASS/FAIL tương ứng.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eCore chỉ chuyển \u003ccode\u003ePASSED\u003c/code\u003e sau khi đạt lần đầu \u003cstrong\u003evà\u003c/strong\u003e ôn lại theo quy tắc.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eCâu sai tự động ghi Error Log và gắn \u003ccode\u003ecore_id\u003c/code\u003e.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eDashboard hiển thị tiến độ P0/P1/P2 và core cần ôn.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eRefresh trình duyệt không mất dữ liệu khi dùng cùng trình duyệt/máy.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eCó import/export tiến độ để tránh rủi ro mất dữ liệu local.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eMixed test có 30 câu và bộ đếm thời gian.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eHoạt động được trên mobile và desktop.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/\u003eCó test đơn vị cho scoring, PASS gating, review schedule và lưu/khôi phục tiến độ.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr /\u003e\n\u003ch2\u003e15. Thứ tự triển khai website đề xuất\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eSprint\u003c/th\u003e\n  \u003cth\u003eMục tiêu\u003c/th\u003e\n  \u003cth\u003eĐầu ra\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS1\u003c/td\u003e\n  \u003ctd\u003eChuẩn hóa roadmap thành metadata + sidebar tree\u003c/td\u003e\n  \u003ctd\u003eDuyệt được tất cả core\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS2\u003c/td\u003e\n  \u003ctd\u003eLesson page + question data schema\u003c/td\u003e\n  \u003ctd\u003eHọc được P0 + WF-01 mẫu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS3\u003c/td\u003e\n  \u003ctd\u003eQuiz player + scoring + PASS/FAIL\u003c/td\u003e\n  \u003ctd\u003eLàm và chấm 10 câu/core\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS4\u003c/td\u003e\n  \u003ctd\u003eProgress + Error Log + Review Queue\u003c/td\u003e\n  \u003ctd\u003eLưu tiến độ và xử lý lỗi sai\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS5\u003c/td\u003e\n  \u003ctd\u003eNội dung mở rộng P1/P2 + mixed test\u003c/td\u003e\n  \u003ctd\u003eHọc được toàn bộ roadmap\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eS6\u003c/td\u003e\n  \u003ctd\u003eTimed Part 5 + export/import + QA\u003c/td\u003e\n  \u003ctd\u0 const STORAGE_KEY='toeic_part5_roadmap_600plus_v1';
const NAV=[['dashboard','◫','Tổng quan'],['roadmap','▦','Cây kiến thức'],['plan','▤','Lộ trình 8 tuần'],['practice','◉','Luyện tập'],['mistakes','▣','Sổ lỗi sai'],['vocab','▧','Từ vựng'],['document','≡','Tài liệu đầy đủ'],['settings','⚙','Dữ liệu & cài đặt']];
const COREMAP=Object.fromEntries(DB.cores.map(c=>[c.id,c]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}
const initial=()=>({version:1,cores:{},mistakes:[],diagnostics:[],createdAt:new Date().toISOString()});
let state=loadState(), route='dashboard', selectedCore=null, lastMini=null, diagSelection={}, diagResult=null, currentFilter='all', searchQuery='', toastTimer=null;
function loadState(){try{let x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&typeof x==='object'&&x.version===1&&x.cores&&typeof x.cores==='object'&&Array.isArray(x.mistakes))return x}catch(e){}return initial()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){toast('Không lưu được tiến độ. Kiểm tra chế độ riêng tư hoặc dung lượng trình duyệt.')}}
function cstate(id){return state.cores[id]||{status:'NOT_STARTED',notes:'',attempts:[]}}
function record(id,patch){state.cores[id]={...cstate(id),...patch};save()}
function totalPassed(){return DB.cores.filter(c=>cstate(c.id).status==='PASSED').length}
function countDue(){return DB.cores.filter(c=>cstate(c.id).status==='REVIEW_DUE'&&daysTill(cstate(c.id).firstPassAt)<=0).length}
function daysTill(date){if(!date)return 999;return Math.max(0,Math.ceil((new Date(date).getTime()+72*3600*1000-Date.now())/(24*3600*1000)))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
function jump(r,id){route=r;selectedCore=id||null;lastMini=null;diagResult=null;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');render();window.scrollTo({top:0,behavior:'instant'})}
function updateNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button type="button" class="nav-item ${route===n[0]?'active':''}" data-action="nav" data-view="${n[0]}"><span class="nav-ico">${n[1]}</span>${n[2]}</button>`).join('');let passed=totalPassed();document.getElementById('sideProgress').textContent=`${passed} / 40 core đã PASS`;document.getElementById('sideFill').style.width=`${passed/40*100}%`;document.getElementById('crumb').textContent=route==='core'?selectedCore:NAV.find(n=>n[0]===route)?.[2]||'Tổng quan'}
function pbar(n,d=40){return `<div class="progress-track"><div class="progress-fill" style="width:${d?100*n/d:0}%"></div></div>`}
function status(id){let s=cstate(id).status;return {NOT_STARTED:'Chưa học',LEARNING:'Đang học',PRACTICING:'Đang luyện',REVIEW_DUE:daysTill(cstate(id).firstPassAt)===0?'Đến hạn ôn':'Chờ ôn lại',PASSED:'Đã PASS',NEEDS_REVIEW:'Cần ôn lại'}[s]||'Chưa học'}
function tag(p){return `<span class="tag ${p.toLowerCase()}">${p}</span>`}
function dash(){let passed=totalPassed(),started=DB.cores.filter(c=>cstate(c.id).status!=='NOT_STARTED').length,due=countDue();return `<div class="hero"><div><div class="eyebrow">YOUR LEARNING ROADMAP · PART 5</div><h1>Từ Reading 135 đến<br>mục tiêu TOEIC 600+</h1><p>40 core kiến thức · Học đúng trọng tâm · Theo dõi tiến độ từng bước. Không cần framework, không cần tài khoản.</p><div class="btnrow"><button class="btn" data-action="nav" data-view="roadmap">Khám phá cây kiến thức →</button><button class="btn secondary" data-action="nav" data-view="practice">Kiểm tra đầu vào</button></div></div><div class="hero-side"><div class="hero-medal">◈</div></div></div>
<div class="section grid g4"><div class="card metric"><div class="k">Core đã PASS</div><div class="v">${passed}<small> / 40</small></div>${pbar(passed)}</div><div class="card metric"><div class="k">Đã bắt đầu học</div><div class="v">${started}<small> core</small></div><small>Gồm các core đang ôn</small></div><div class="card metric"><div class="k">Đến hạn ôn lại</div><div class="v">${due}</div><small>Ôn sau ít nhất 3 ngày</small></div><div class="card metric"><div class="k">Part 5 mục tiêu</div><div class="v">20–23<small>/30</small></div><small>Đúng trong đề luyện mới</small></div></div>
<div class="section"><div class="section-title"><div><h2>Knowledge Tree</h2><p>Học từ Foundation đến Sentence Expansion</p></div><button class="btn secondary sm" data-action="nav" data-view="roadmap">Xem toàn bộ →</button></div><div class="grid g3">${DB.groups.map(g=>groupCard(g)).join('')}</div></div>
<div class="section grid g2"><div class="card"><div class="section-title"><div><h2>Quy trình đạt PASS</h2><p>Hiểu bản chất trước khi chuyển core</p></div></div>${[['01','Học quy tắc và ví dụ','Phân biệt các cấu trúc tương tự, ghi nhớ bẫy.'],['02','Luyện câu minh họa','Dùng mini-check để củng cố, không tính là chứng nhận.'],['03','Kiểm tra thật 10 câu','Nhập điểm đã làm, đạt ≥8/10 hoặc ≥9/10 tùy core.'],['04','Ôn lại sau ≥3 ngày','Dùng bộ câu khác. Đạt ngưỡng lần nữa mới PASS.']].map(x=>`<div class="step" style="margin-top:17px"><div class="stepnum">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div><div class="card"><div class="section-title"><div><h2>Tiếp tục học</h2><p>Đề xuất theo tiến độ hiện tại</p></div></div>${recommendations()}<div class="notice" style="margin-top:18px">Mục tiêu 600+ là tổng Listening + Reading. Hoàn thành Part 5 không thay thế việc học Part 6, Part 7 và Listening.</div></div></div>`}
function groupCard(g){let list=DB.cores.filter(c=>c.group===g.id),pass=list.filter(c=>cstate(c.id).status==='PASSED').length;return `<div class="card group" tabindex="0" role="button" data-action="group" data-id="${g.id}" style="--local:${g.color};--tint:${g.color}16"><div class="group-top"><div class="g-icon">${g.id}</div>${tag(g.priority)}</div><h3>${g.en}</h3><p>${g.vi} · ${list.length} core</p><div class="meter"><span>Đã hoàn thành</span><strong>${pass}/${list.length}</strong></div>${pbar(pass,list.length)}</div>`}
function recommendations(){let sorted=DB.cores.filter(c=>cstate(c.id).status!=='PASSED');if(!sorted.length)return '<div class="notice good">Mày đã PASS tất cả 40 core. Tiếp tục luyện đề mới và duy trì review.</div>';const due=sorted.filter(c=>cstate(c.id).status==='REVIEW_DUE'&&daysTill(cstate(c.id).firstPassAt)===0);let shown=[...due,...sorted.filter(c=>!due.includes(c))].slice(0,3);return shown.map(c=>`<button class="core-row" style="width:100%;border:1px solid var(--line);border-radius:10px;margin-top:9px;background:#fff;text-align:left" data-action="core" data-id="${c.id}"><div class="coreid">${esc(c.id)}</div><div><div class="corename">${esc(c.title)}</div><div class="coresub">${DB.groups.find(g=>g.id===c.group).en}</div></div><span style="font-size:16px">›</span></button>`).join('')}
function roadmap(){let ids=new Set(DB.cores.filter(c=>(currentFilter==='all'||(currentFilter==='todo'&&cstate(c.id).status!=='PASSED')||(currentFilter==='due'&&cstate(c.id).status==='REVIEW_DUE')||(currentFilter===c.group))&&(`${c.id} ${c.title} ${c.rule}`.toLowerCase().includes(searchQuery.toLowerCase()))).map(c=>c.id));return `<div class="eyebrow">LEARNING LIBRARY</div><h1 class="headline">Cây kiến thức Part 5</h1><p class="subtitle">40 core chia thành 6 nhóm. Click vào từng core để xem quy tắc, ví dụ, bẫy, prerequisite và lưu kết quả.</p><div class="filters"><input class="search" id="coreSearch" placeholder="Tìm core, keyword, công thức..." value="${esc(searchQuery)}" aria-label="Tìm core" /><select class="select" id="coreFilter" aria-label="Lọc danh sách"><option value="all">Tất cả 40 core</option><option value="todo">Chưa PASS</option><option value="due">Chờ ôn lại</option>${DB.groups.map(g=>`<option value="${g.id}">${g.id} · ${g.en}</option>`).join('')}</select></div><div id="roadmapList">${groupsList(ids)}</div>`}
function groupsList(ids){let output=DB.groups.map(g=>{let list=DB.cores.filter(c=>c.group===g.id&&ids.has(c.id));if(!list.length)return '';return `<section class="list-group"><h3><span class="g-icon" style="width:31px;height:31px;background:${g.color}16;color:${g.color}">${g.id}</span>${g.en} <span class="tag">${list.length} core</span></h3><div class="card" style="padding:0;overflow:hidden">${list.map(c=>`<div class="core-row" role="button" tabindex="0" data-action="core" data-id="${c.id}"><div class="coreid">${c.id}</div><div><div class="corename">${esc(c.title)}</div><div class="coresub">${esc(c.requires.length?'Cần: '+c.requires.join(', '):'Core nền tảng · không có prerequisite')}</div></div><div class="pillstatus ${cstate(c.id).status}">${status(c.id)}</div></div>`).join('')}</div></section>`}).join('');return output||'<div class="card empty"><strong>Không có core phù hợp.</strong><p>Thử từ khóa hoặc bộ lọc khác.</p></div>'}
function lesson(id){const c=COREMAP[id];if(!c)return `<div class="card">Không tìm thấy core.</div>`;if(cstate(id).status==='NOT_STARTED')record(id,{status:'LEARNING',startedAt:new Date().toISOString()});const s=cstate(id),prev=DB.cores[DB.cores.indexOf(c)-1],next=DB.cores[DB.cores.indexOf(c)+1],prereq=c.requires.filter(id=>cstate(id).status!=='PASSED');return `<button class="back" data-action="nav" data-view="roadmap">← Quay lại cây kiến thức</button><div class="lesson-head"><div><div class="btnrow">${tag(c.priority)} <span class="tag">${c.id}</span> <span class="pillstatus ${s.status}">${status(id)}</span></div><h1 class="lesson-title">${esc(c.title)}</h1><p class="subtitle">${DB.groups.find(g=>g.id===c.group).en} · Điều kiện PASS: ${c.threshold}/10 lần đầu và lần ôn lại sau ≥3 ngày.</p></div><div class="btnrow">${prev?`<button class="btn secondary sm" data-action="core" data-id="${prev.id}">← Core trước</button>`:''}${next?`<button class="btn secondary sm" data-action="core" data-id="${next.id}">Core tiếp →</button>`:''}</div></div><div class="lesson-sections"><div><section class="card lesson-card"><h3>01 · Kiến thức cốt lõi (CORE)</h3><div class="lesson-text">${inline(c.rule||'Xem nội dung chi tiết trong tài liệu gốc.')}</div>${c.hint?`<div class="box-note"><strong>Dấu hiệu gợi ý:</strong> ${inline(c.hint)}</div>`:''}${c.recognition?`<div class="box-note"><strong>Cách nhận diện:</strong> ${inline(c.recognition)}</div>`:''}</section><section class="card lesson-card"><h3>02 · Ví dụ & cách nhận diện</h3><div class="lesson-text">${inline(c.example||'Xem phần kiến thức trong tài liệu đầy đủ.')}</div></section><section class="card lesson-card"><h3>03 · Bẫy TOEIC cần tránh</h3><div class="box-trap">${inline(c.trap||'Đọc đủ chủ ngữ, động từ và ngữ cảnh; tránh áp dụng mẹo cứng nhắc.')}</div></section><section class="card lesson-card"><h3>04 · Quick Check (1 câu minh họa)</h3><p class="small muted">Giúp hiểu cách ra đề. Đây không phải bài test 10 câu để chứng nhận PASS.</p>${renderMini(id)}</section><section class="card lesson-card"><h3>05 · Ghi chú của tao</h3><p class="small muted">Ghi công thức, ví dụ hoặc lỗi dễ nhầm, sau đó nhấn Lưu ghi chú.</p><div class="field"><textarea id="coreNotes" placeholder="Ví dụ: is + V-ing = hành động đang diễn ra...">${esc(s.notes||'')}</textarea></div><button class="btn secondary sm" data-action="saveNotes" data-id="${id}">Lưu ghi chú</button></section></div><aside class="card sidebar-card"><h3 style="font-size:15px;margin:0 0 11px">Tiến độ core</h3><div class="pillstatus ${s.status}" style="display:inline-block">${status(id)}</div><div style="margin-top:15px"><strong class="small">Prerequisites</strong>${c.requires.length?`<div class="btnrow" style="margin-top:8px">${c.requires.map(x=>`<button class="btn secondary sm" data-action="core" data-id="${x}">${x} ${cstate(x).status==='PASSED'?'✓':''}</button>`).join('')}</div>`:'<p class="muted small">Không có prerequisite.</p>'}</div>${prereq.length?`<div class="notice" style="margin-top:13px">Chưa PASS: ${prereq.join(', ')}. Mày vẫn có thể xem trước nội dung.</div>`:''}<hr style="border:0;border-top:1px solid var(--line);margin:19px 0"/><strong class="small">Đánh giá 10 câu — nhập kết quả thực tế</strong><p class="small muted" style="margin:6px 0">Tài liệu hiện chưa có 2 bộ test độc lập đủ 10 câu/core. Hãy làm bài riêng rồi nhập điểm; website chỉ theo dõi quy tắc PASS, không tự xác nhận chất lượng bài đó.</p><div class="field"><label for="scoreInput">Số câu đúng / 10</label><input type="number" id="scoreInput" min="0" max="10" step="1" placeholder="Ví dụ: 9" /></div><button class="btn" style="width:100%" data-action="score" data-id="${id}">${s.firstPassAt?'Ghi kết quả ôn lại':'Ghi kết quả lần đầu'}</button>${assessmentInfo(c,s)}<div style="margin-top:16px"><strong class="small">Tiêu chí tài liệu</strong><p class="small muted">${inline(c.passText||`Ít nhất ${c.threshold}/10 và kiểm tra lại sau 3 ngày.`)}</p></div></aside></div>`}
function renderMini(id){const q=DB.mini[id];const checked=lastMini?.id===id;return `<p class="quiz-title">${esc(q.stem)}</p><div>${q.options.map((o,i)=>`<button class="quizopt ${checked?i===q.answer?'good':lastMini.answer===i?'bad':'':''}" ${checked?'disabled':''} data-action="mini" data-id="${id}" data-answer="${i}"><strong>${'ABCD'[i]}.</strong> ${esc(o)}</button>`).join('')}</div>${checked?`<div class="notice ${lastMini.answer===q.answer?'good':'bad'}"><strong>${lastMini.answer===q.answer?'Chính xác':'Chưa đúng'} — ${'ABCD'[q.answer]}</strong><div>${esc(q.explanation)}</div></div><button style="margin-top:10px" class="btn secondary sm" data-action="repeatMini" data-id="${id}">Làm lại ví dụ</button>`:''}`}
function assessmentInfo(c,s){if(s.status==='PASSED')return `<div class="notice good" style="margin-top:13px"><strong>✓ PASSED</strong><div>Đã ghi nhận đạt ≥${c.threshold}/10 trong hai lượt cách nhau ít nhất 3 ngày.</div></div>`;if(s.firstPassAt){let days=daysTill(s.firstPassAt);return `<div class="notice ${days===0?'good':''}" style="margin-top:13px"><strong>Đạt lần đầu: ${s.firstScore}/10</strong><div>${days===0?'Đã đến hạn ôn lại. Dùng bộ câu hỏi mới (khác bộ đầu).':`Còn khoảng ${days} ngày mới đủ 72 giờ để xác nhận PASS.`}</div></div>`}return `<div class="notice" style="margin-top:13px">Lần đầu cần ≥${c.threshold}/10; lần ôn sau ≥3 ngày cũng cần ≥${c.threshold}/10.</div>`}
function plan(){const weeks=[['01','Foundation + Word Forms','P0 (5 core) và WF-01 → WF-06','P0 ≥9/10; WF mixed ≥17/20'],['02','Verb System · Phần 1','VB-01 → VB-06: chia động từ và các thì cơ bản','Nhận diện đúng S–V và thời điểm'],['03','Verb System · Phần 2','VB-07 → VB-10, ôn lại VB-01 → VB-06','VB mixed ≥25/30'],['04','Pronouns & Connectors','PD-01 → PD-06, CP-01 → CP-07','PD mixed ≥17/20; CP mixed ≥16/20'],['05','Sentence Expansion','SE-01 → SE-06, ưu tiên SE-01 → SE-04','P2 mixed ≥24/30'],['06','Mixed Practice','3–4 bộ trộn 30 câu, ghi nhật ký lỗi','Hướng tới 18–20/30'],['07','Part 5 tính giờ','4–5 bộ mới; ôn lại nhóm có nhiều lỗi','Hướng tới 20–22/30; 12–15 phút'],['08','Exam Readiness','Part 5 + ít nhất 1 full Reading 5–7','Hướng tới 20–23/30; 10–12 phút']];return `<div class="eyebrow">8-WEEK LEARNING PLAN</div><h1 class="headline">Lộ trình 8 tuần</h1><p class="subtitle">60–90 phút/ngày · 6 ngày/tuần. Chỉ chuyển giai đoạn khi đạt yêu cầu, không ép tiến độ theo lịch.</p><div class="grid g2"><div class="card"><h2 style="font-size:17px;margin:0 0 20px">Các giai đoạn học</h2>${weeks.map(w=>`<div class="week"><h3>Tuần ${w[0]} · ${w[1]}</h3><p>${w[2]}</p><div class="info-strip"><span><b>Gate:</b> ${w[3]}</span></div></div>`).join('')}</div><div><div class="card" style="margin-bottom:14px"><h2 style="font-size:17px;margin:0 0 17px">Một buổi học 75 phút</h2>${[['15 phút','Ôn core cũ, câu sai'],['20 phút','Học một core mới'],['30 phút','Luyện 15–20 câu & sửa lỗi'],['10 phút','Vocabulary (5–8 cụm)']].map((x,i)=>`<div class="frow" style="margin:13px 0;align-items:start"><span class="tag" style="min-width:75px;justify-content:center">${x[0]}</span><span class="small">${x[1]}</span></div>`).join('')}</div><div class="card"><h2 style="font-size:17px;margin:0 0 12px">Điều kiện chuyển giai đoạn</h2><div class="small"><p><b>P0:</b> Cả 5 core đạt PASS + tổng hợp ≥9/10.</p><p><b>Word Forms:</b> 6 core đạt PASS + mixed ≥17/20.</p><p><b>Verb System:</b> 10 core đạt PASS + mixed ≥25/30.</p><p><b>Pronouns:</b> 6 core đạt PASS + mixed ≥17/20.</p><p><b>Connectors:</b> 7 core đạt PASS + mixed ≥16/20, sau 3 ngày ≥17/20.</p><p><b>P2:</b> 6 core đạt PASS + mixed ≥24/30.</p><p><b>Chuyển sang cày đề:</b> P0 hoàn thành, ≥90% P1 đã PASS, các core trọng tâm P2 đã học, mixed 30 câu ≥24/30 không giới hạn thời gian.</p></div></div></div></div>`}
const DIAG=[['The manager is ______ the budget.',['review','reviewed','reviewing','reviews'],2,'VB-05','is + V-ing = đang thực hiện hành động.'],['The company hired a ______ designer.',['profession','professional','professionally','professionalism'],1,'WF-03','professional là tính từ bổ nghĩa designer.'],['All employees must bring ______ identification cards.',['they','them','their','theirs'],2,'PD-02','their + danh từ là tính từ sở hữu.'],['The event was canceled ______ the bad weather.',['because','because of','although','while'],1,'CP-01','because of + cụm danh từ.'],['The documents ______ yesterday.',['send','sent','were sent','sending'],2,'VB-07','were sent là dạng bị động quá khứ.'],['The new software works more ______ than the previous version.',['efficient','efficiency','efficiently','efficiencies'],2,'WF-04','efficiently là trạng từ bổ nghĩa works.']];
function practice(){let count=Object.keys(diagSelection).length;return `<div class="eyebrow">CHECK YOUR FOUNDATION</div><h1 class="headline">Diagnostic Mini Test</h1><p class="subtitle">6 câu mẫu từ roadmap để phát hiện nhánh cần ôn. Bài này không đại diện cho điểm TOEIC thật và không dùng để PASS core.</p><div class="card" style="max-width:770px"><div class="meter"><span>Đã trả lời</span><b>${count}/6</b></div>${pbar(count,6)}${DIAG.map((q,i)=>`<section style="border-bottom:1px solid var(--line);padding:20px 0"><div class="small muted" style="margin-bottom:5px">CÂU ${i+1} · ${q[4]}</div><div class="quiz-title">${esc(q[0])}</div>${q[1].map((op,j)=>`<button class="quizopt ${diagResult?(j===q[2]?'good':diagSelection[i]===j?'bad':''):diagSelection[i]===j?'selected':''}" data-action="diag" data-i="${i}" data-j="${j}" ${diagResult?'disabled':''}><strong>${'ABCD'[j]}.</strong> ${esc(op)}</button>`).join('')}${diagResult?`<div class="notice ${diagSelection[i]===q[2]?'good':'bad'}">Đáp án ${'ABCD'[q[2]]}. ${esc(q[5])}</div>`:''}</section>`).join('')}${diagResult?`<div class="section"><div class="quiz-score">${diagResult.score}/6</div><p class="small muted">${diagResult.score<=2?'Bắt đầu từ P0 và Word Forms.':diagResult.score<=4?'Ôn P0 và các core trả lời sai.':'Nền tảng mẫu khá tốt, nên kiểm tra sâu từng core.'}</p><div class="btnrow"><button class="btn" data-action="nav" data-view="roadmap">Học theo roadmap →</button><button class="btn secondary" data-action="restartDiag">Làm lại</button></div></div>`:`<div class="btnrow" style="margin-top:20px"><button class="btn" data-action="submitDiag" ${count!==6?'disabled':''}>Chấm bài (6 câu)</button></div>`}</div>`}
function mistakeList(){let errs=state.mistakes||[];return `<div class="eyebrow">ERROR LOG</div><h1 class="headline">Nhật ký lỗi sai</h1><p class="subtitle">Ghi lại các lỗi ở mini-check và diagnostic. Ôn theo core thay vì chỉ học đáp án.</p><div class="card" style="max-width:850px"><div class="section-title"><h2>${errs.length} lỗi đã ghi</h2>${errs.length?'<button class="btn secondary sm" data-action="clearMistakes">Xóa nhật ký lỗi</button>':''}</div>${errs.length?errs.slice().reverse().map(e=>`<div class="error-item"><div class="frow"><strong>${esc(e.coreId)}</strong><span class="tag">${esc(new Date(e.date).toLocaleDateString('vi-VN'))}</span><button class="btn secondary sm" data-action="core" data-id="${esc(e.coreId)}">Ôn core →</button></div><p>${esc(e.stem)}</p><div class="small">Mày chọn <b>${esc('ABCD'[e.selected]||'?')}</b>; đáp án đúng <b>${esc('ABCD'[e.correct]||'?')}</b>. ${esc(e.explanation)}</div></div>`).join(''):'<div class="empty"><div class="emoji">◎</div><strong>Chưa có lỗi nào được ghi.</strong><p>Làm diagnostic hoặc mini-check để bắt đầu theo dõi lỗi sai.</p></div>'}</div>`}
function vocab(){const cols=[['Word Families',['apply → application → applicant','produce → product → production → productive','succeed → success → successful → successfully','consider → consideration → considerable → considerably']],['Collocations',['sign / renew a contract','meet a deadline','submit a report','attend a meeting','launch a product','increase capacity','review an application']],['Business Vocabulary',['Office: schedule, document, colleague','Recruitment: applicant, position, hire','Finance: budget, invoice, payment','Manufacturing: factory, plant, equipment','Logistics: shipment, supplier, warehouse','Events: trade show, press release']]];return `<div class="eyebrow">VOCABULARY · MINIMUM VIABLE</div><h1 class="headline">Từ vựng học chọn lọc</h1><p class="subtitle">Tập trung vào word families, collocations và business English. Học 5–8 từ/cụm mỗi ngày từ bài tập thực tế, ôn theo chu kỳ 1–3–7 ngày.</p><div class="grid g3">${cols.map((g,i)=>`<div class="card"><span class="tag">V-0${i+1}</span><h2 style="font-size:17px;margin:12px 0">${g[0]}</h2>${g[1].map(t=>`<div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:13px">${esc(t)}</div>`).join('')}</div>`).join('')}</div><div class="notice" style="margin-top:18px">Các nhóm này chỉ là điểm bắt đầu; không cần học thuộc hàng nghìn từ trước khi giải đề Part 5.</div>`}
function documentView(){return `<div class="eyebrow">ORIGINAL SOURCE · FULL CONTENT</div><h1 class="headline">Toàn bộ roadmap Markdown</h1><p class="subtitle">Nội dung nguyên vẹn từ tài liệu Markdown gốc, gồm quy tắc học, toàn bộ 40 core, điều kiện Gate, practice, error log và đặc tả website.</p><article class="card doc-wrap rich-doc">${DB.full}</article>`}
function settings(){return `<div class="eyebrow">LOCAL-FIRST STORAGE</div><h1 class="headline">Dữ liệu & cài đặt</h1><p class="subtitle">Tiến độ lưu bằng localStorage trên trình duyệt hiện tại. Nếu xóa dữ liệu trình duyệt hoặc đổi thiết bị, hãy nhập bản sao JSON đã xuất trước đó.</p><div class="grid g2"><div class="card"><h2 style="font-size:17px;margin:0 0 9px">Sao lưu tiến độ</h2><p class="muted small">Xuất JSON chứa trạng thái core, điểm tự nhập, ghi chú và nhật ký lỗi.</p><div class="btnrow"><button class="btn" data-action="export">⇩ Xuất JSON</button><button class="btn secondary" data-action="import">⇧ Nhập JSON</button></div></div><div class="card"><h2 style="font-size:17px;margin:0 0 9px">Reset dữ liệu</h2><p class="muted small">Xóa toàn bộ trạng thái, ghi chú, kết quả và Error Log của website này trong trình duyệt.</p><button class="btn danger" data-action="reset">Đặt lại từ đầu</button></div></div><div class="section card"><h2 style="font-size:17px;margin:0 0 10px">Giới hạn phiên bản HTML một file</h2><p class="small muted">Bản này có đủ 40 bài core dạng tóm tắt theo roadmap; mỗi core có 1 câu kiểm tra minh họa và có 6 câu diagnostic. <b>Chưa có ngân hàng gồm 2 bộ 10 câu độc lập cho mỗi core</b> hoặc đề mock 30 câu hoàn chỉnh. Vì vậy hệ thống cho mày <b>nhập điểm bài kiểm tra 10 câu bên ngoài</b>, rồi áp dụng quy tắc PASS sau lần ôn ≥3 ngày. Để tự động kiểm tra hoàn toàn, cần bổ sung và rà soát ngân hàng câu hỏi. Dữ liệu chỉ lưu tại thiết bị này, không đồng bộ máy khác.</p></div>`}
function render(){updateNav();let view=route==='dashboard'?dash():route==='roadmap'?roadmap():route==='core'?lesson(selectedCore):route==='plan'?plan():route==='practice'?practice():route==='mistakes'?mistakeList():route==='vocab'?vocab():route==='document'?documentView():settings();document.getElementById('mainContent').innerHTML=view;if(route==='roadmap'){document.getElementById('coreFilter').value=currentFilter}}
function addMistake(coreId,stem,selected,correct,explanation){state.mistakes.push({coreId,stem,selected,correct,explanation,date:new Date().toISOString()});if(state.mistakes.length>1000)state.mistakes=state.mistakes.slice(-1000);save()}
function assess(id){let input=document.getElementById('scoreInput'),text=input?.value?.trim();const c=COREMAP[id],s=cstate(id);if(text===''||!/^\d+$/.test(text)||Number(text)>10){toast('Điểm phải là số nguyên từ 0 đến 10.');return}let score=Number(text),att={date:new Date().toISOString(),score,threshold:c.threshold};const attempts=[...(s.attempts||[]),att];if(s.status==='PASSED'){toast('Core đã PASS. Không cần ghi thêm điểm.');return}if(score<c.threshold){record(id,{status:'NEEDS_REVIEW',attempts,firstPassAt:null,firstScore:null});toast(`Chưa đạt ${c.threshold}/10. Ôn lại core và thử bài khác.`)}else if(!s.firstPassAt){record(id,{status:'REVIEW_DUE',attempts,firstPassAt:new Date().toISOString(),firstScore:score});toast('Đạt lượt 1. Ôn bằng bộ câu khác sau ít nhất 3 ngày.')}else if(daysTill(s.firstPassAt)>0){record(id,{attempts});toast(`Chưa đủ 72 giờ. Còn khoảng ${daysTill(s.firstPassAt)} ngày; chưa thể PASS.`)}else{record(id,{status:'PASSED',attempts,passedAt:new Date().toISOString(),lastScore:score});toast(`✓ ${id} đã PASS.`)}render()}
function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`toeic-progress-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),300);toast('Đã xuất file JSON tiến độ.')}
function importData(file){if(!file)return;if(file.size>3_000_000){toast('File dữ liệu vượt quá 3 MB.');return}file.text().then(t=>{const o=JSON.parse(t);if(!o||o.version!==1||!o.cores||typeof o.cores!=='object'||Array.isArray(o.cores)||!Array.isArray(o.mistakes))throw Error('wrong schema');if(!confirm('Nhập dữ liệu này sẽ ghi đè tiến độ hiện tại. Tiếp tục?'))return;state={...initial(),...o};save();render();toast('Đã nhập tiến độ thành công.')}).catch(()=>toast('Không đọc được JSON hợp lệ của roadmap này.'))}
function act(node){const type=node.dataset.action;switch(type){case'nav':jump(node.dataset.view);break;case'group':currentFilter=node.dataset.id;searchQuery='';jump('roadmap');break;case'core':jump('core',node.dataset.id);break;case'mini':{const id=node.dataset.id,q=DB.mini[id],answer=Number(node.dataset.answer);lastMini={id,answer};if(answer!==q.answer)addMistake(id,q.stem,answer,q.answer,q.explanation);record(id,{status:cstate(id).status==='LEARNING'?'PRACTICING':cstate(id).status});render();break}case'repeatMini':lastMini=null;render();break;case'saveNotes':{const id=node.dataset.id;record(id,{notes:document.getElementById('coreNotes').value});toast('Đã lưu ghi chú.');break}case'score':assess(node.dataset.id);break;case'diag':{if(diagResult)return;diagSelection[Number(node.dataset.i)]=Number(node.dataset.j);render();break}case'submitDiag':{if(Object.keys(diagSelection).length!==6)return;let score=0;DIAG.forEach((q,i)=>{if(diagSelection[i]===q[2])score++;else addMistake(q[4],q[0],diagSelection[i],q[2],q[5])});diagResult={score,date:new Date().toISOString()};state.diagnostics.push(diagResult);save();render();break}case'restartDiag':diagSelection={};diagResult=null;render();break;case'clearMistakes':if(confirm('Xóa toàn bộ nhật ký lỗi sai?')){state.mistakes=[];save();render()}break;case'export':download();break;case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Xóa tất cả tiến độ và ghi chú? Không thể khôi phục nếu chưa xuất JSON.')){state=initial();save();jump('dashboard')}break}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-action]');if(n)act(n)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){let n=e.target.closest('[role="button"][data-action]');if(n){e.preventDefault();act(n)}}});
document.addEventListener('input',e=>{if(e.target.id==='coreSearch'){searchQuery=e.target.value;const ids=new Set(DB.cores.filter(c=>(currentFilter==='all'||(currentFilter==='todo'&&cstate(c.id).status!=='PASSED')||(currentFilter==='due'&&cstate(c.id).status==='REVIEW_DUE')||(currentFilter===c.group))&&(`${c.id} ${c.title} ${c.rule}`.toLowerCase().includes(searchQuery.toLowerCase()))).map(c=>c.id));document.getElementById('roadmapList').innerHTML=groupsList(ids)}});
document.addEventListener('change',e=>{if(e.target.id==='coreFilter'){currentFilter=e.target.value;render()}if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
document.getElementById('toggleMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')});document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')});
render();
</script></body></html>
